<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 农业报表系统</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
        .login-image {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-form {
            padding: 60px 40px;
        }
        .form-group label {
            font-weight: 600;
            color: #333;
        }
        .form-control {
            border-radius: 10px;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        .feature-text {
            opacity: 0.9;
            font-size: 0.95rem;
        }
        .back-link {
            color: #666;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: #667eea;
            text-decoration: none;
        }
        .alert {
            border-radius: 10px;
        }
        @media (max-width: 768px) {
            .login-image {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="row m-0">
            <!-- 左侧图片区域 -->
            <div class="col-md-5 login-image">
                <h2 class="mb-4 font-weight-bold">
                    <i class="fas fa-seedling mr-2"></i>农业报表系统
                </h2>
                <p class="mb-5 feature-text">
                    智慧农业，精准管理。全方位的农业生产数据管理平台。
                </p>
                <div class="mb-4">
                    <div class="feature-icon"><i class="fas fa-chart-line"></i></div>
                    <div class="feature-text">生产报表 - 产量、成本、收益分析</div>
                </div>
                <div class="mb-4">
                    <div class="feature-icon"><i class="fas fa-dollar-sign"></i></div>
                    <div class="feature-text">财务报表 - 收入支出利润汇总</div>
                </div>
                <div>
                    <div class="feature-icon"><i class="fas fa-leaf"></i></div>
                    <div class="feature-text">环境报表 - 资源使用效率分析</div>
                </div>
            </div>
            
            <!-- 右侧登录表单 -->
            <div class="col-md-7 login-form">
                <div class="text-center mb-4">
                    <h3 class="font-weight-bold text-dark">欢迎回来</h3>
                    <p class="text-muted">请登录您的账户</p>
                </div>
                
                <!-- 提示信息 -->
                <div class="alert alert-info" id="testInfo">
                    <i class="fas fa-info-circle mr-2"></i>
                    测试账号：<strong>admin</strong> / <strong>admin123</strong>
                </div>
                
                <!-- 错误提示 -->
                <div class="alert alert-danger d-none" id="errorAlert">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="errorMessage"></span>
                </div>
                
                <!-- 登录表单 -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user mr-2"></i>用户名
                        </label>
                        <input type="text" class="form-control" id="username" 
                               placeholder="请输入用户名" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock mr-2"></i>密码
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" 
                                   placeholder="请输入密码" required>
                            <div class="input-group-append">
                                <span class="input-group-text" style="cursor: pointer;" 
                                      onclick="togglePassword()">
                                    <i class="fas fa-eye" id="eyeIcon"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">记住我</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-login btn-block text-white" 
                            id="loginBtn">
                        <i class="fas fa-sign-in-alt mr-2"></i>登 录
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <a href="/" class="back-link">
                        <i class="fas fa-arrow-left mr-1"></i>返回首页
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // API基础URL
        const API_BASE = '/api';
        
        // 切换密码可见性
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        }
        
        // 显示错误信息
        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.textContent = message;
            errorAlert.classList.remove('d-none');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                errorAlert.classList.add('d-none');
            }, 3000);
        }
        
        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            // 验证输入
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }
            
            // 禁用按钮，显示加载状态
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';
            
            try {
                // 构建JSON数据
                const requestData = {
                    username: username,
                    password: password
                };
                
                // 发送登录请求
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // 保存令牌
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('username', username);
                    
                    // 显示成功信息
                    loginBtn.innerHTML = '<i class="fas fa-check mr-2"></i>登录成功';
                    loginBtn.classList.remove('btn-primary');
                    loginBtn.classList.add('btn-success');
                    
                    // 跳转页面
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    showError(data.detail || '登录失败，请检查用户名和密码');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>登 录';
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('网络错误，请稍后重试');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>登 录';
            }
        });
        
        // 回车键提交
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });
    </script>
</body>
</html>
