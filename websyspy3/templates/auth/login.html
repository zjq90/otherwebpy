{% extends "base.html" %}

{% block title %}登录 - CD管理系统{% endblock %}

{% block auth_content %}
<div class="login-container">
    <div class="card login-card shadow-lg">
        <div class="text-center mb-4">
            <i class="bi bi-disc display-4 text-primary"></i>
            <h3 class="mt-3">CD管理系统</h3>
            <p class="text-muted">请登录您的账户</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}
        
        {% if registered %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            注册成功！请使用新账号登录。
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}
        
        <form method="POST" action="/auth/login">
            <div class="mb-3">
                <label for="username" class="form-label">
                    <i class="bi bi-person"></i> 用户名
                </label>
                <input type="text" class="form-control" id="username" name="username" 
                       placeholder="请输入用户名" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">
                    <i class="bi bi-lock"></i> 密码
                </label>
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="请输入密码" required>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label" for="remember">
                    记住我
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right"></i> 登录
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="text-muted mb-0">
                还没有账户？
                <a href="/auth/register" class="text-primary text-decoration-none">
                    立即注册
                </a>
            </p>
        </div>
        
        <hr class="my-4">
        
        <div class="text-center">
            <small class="text-muted">
                测试账号：admin / admin123 (管理员)<br>
                或 user1 / user123 (普通用户)
            </small>
        </div>
    </div>
</div>
{% endblock %}
