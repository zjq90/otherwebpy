{% extends "base.html" %}

{% block title %}注册 - CD管理系统{% endblock %}

{% block auth_content %}
<div class="login-container">
    <div class="card login-card shadow-lg">
        <div class="text-center mb-4">
            <i class="bi bi-person-plus display-4 text-primary"></i>
            <h3 class="mt-3">用户注册</h3>
            <p class="text-muted">创建您的账户</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}
        
        <form method="POST" action="/auth/register">
            <div class="mb-3">
                <label for="username" class="form-label">
                    <i class="bi bi-person"></i> 用户名
                </label>
                <input type="text" class="form-control" id="username" name="username" 
                       placeholder="请输入用户名" required>
                <div class="form-text">用户名唯一，用于登录</div>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">
                    <i class="bi bi-envelope"></i> 邮箱
                </label>
                <input type="email" class="form-control" id="email" name="email" 
                       placeholder="请输入邮箱地址" required>
                <div class="form-text">用于找回密码和接收通知</div>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">
                    <i class="bi bi-lock"></i> 密码
                </label>
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="请输入密码" required>
                <div class="form-text">密码长度至少6位</div>
            </div>
            
            <div class="mb-3">
                <label for="confirm_password" class="form-label">
                    <i class="bi bi-lock-fill"></i> 确认密码
                </label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                       placeholder="请再次输入密码" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-person-plus"></i> 注册
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="text-muted mb-0">
                已有账户？
                <a href="/auth/login" class="text-primary text-decoration-none">
                    立即登录
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
