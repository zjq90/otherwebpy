{% extends "base.html" %}

{% block title %}页面未找到{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-lg-6 text-center">
        <div class="mb-4">
            <i class="bi bi-emoji-frown display-1 text-muted"></i>
        </div>
        <h1 class="display-4 text-muted mb-4">404</h1>
        <h3 class="mb-4">页面未找到</h3>
        <p class="text-muted mb-5">
            抱歉，您访问的页面不存在或已被移除。
        </p>
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="/" class="btn btn-primary btn-lg px-4 gap-3">
                <i class="bi bi-house-door"></i> 返回首页
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg px-4">
                <i class="bi bi-arrow-left"></i> 返回上一页
            </a>
        </div>
    </div>
</div>
{% endblock %}
