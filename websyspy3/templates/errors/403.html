{% extends "base.html" %}

{% block title %}权限不足{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-lg-6 text-center">
        <div class="mb-4">
            <i class="bi bi-shield-lock display-1 text-danger"></i>
        </div>
        <h1 class="display-4 text-danger mb-4">403</h1>
        <h3 class="mb-4">权限不足</h3>
        <p class="text-muted mb-5">
            抱歉，您没有权限访问此页面。
            请联系管理员获取更多权限。
        </p>
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="/" class="btn btn-primary btn-lg px-4 gap-3">
                <i class="bi bi-house-door"></i> 返回首页
            </a>
            {% if not current_user %}
            <a href="/auth/login" class="btn btn-outline-secondary btn-lg px-4">
                <i class="bi bi-box-arrow-in-right"></i> 登录
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
