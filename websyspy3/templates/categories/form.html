{% extends "base.html" %}

{% block title %}{% if action == 'create' %}添加分类{% else %}编辑分类{% endif %} - CD管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi {% if action == 'create' %}bi-folder-plus{% else %}bi-pencil{% endif %}"></i>
                    {% if action == 'create' %}添加新分类{% else %}编辑分类{% endif %}
                </h5>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
                
                <form method="POST" 
                      action="{% if action == 'create' %}/categories/create{% else %}/categories/{{ category.id }}/edit{% endif %}">
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            <i class="bi bi-folder"></i> 分类名称 <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="name" name="name" 
                               placeholder="请输入分类名称" 
                               value="{{ category.name if category else '' }}" required>
                        <div class="form-text">
                            分类名称必须唯一
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">
                            <i class="bi bi-text-left"></i> 描述
                        </label>
                        <textarea class="form-control" id="description" name="description" 
                                  rows="4" placeholder="请输入分类描述">
                            {{- category.description if category else '' -}}
                        </textarea>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="/categories" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回列表
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> 
                            {% if action == 'create' %}保存分类{% else %}更新分类{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
