{% extends "base.html" %}

{% block title %}{% if action == 'create' %}添加CD{% else %}编辑CD{% endif %} - CD管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi {% if action == 'create' %}bi-plus-circle{% else %}bi-pencil{% endif %}"></i>
                    {% if action == 'create' %}添加新CD{% else %}编辑CD信息{% endif %}
                </h5>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
                
                <form method="POST" 
                      action="{% if action == 'create' %}/cds/create{% else %}/cds/{{ cd.id }}/edit{% endif %}">
                    <div class="mb-3">
                        <label for="title" class="form-label">
                            <i class="bi bi-disc"></i> CD名称 <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="title" name="title" 
                               placeholder="请输入CD名称" 
                               value="{{ cd.title if cd else '' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="artist" class="form-label">
                            <i class="bi bi-person"></i> 艺术家/歌手 <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="artist" name="artist" 
                               placeholder="请输入艺术家或歌手名称" 
                               value="{{ cd.artist if cd else '' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="category_id" class="form-label">
                            <i class="bi bi-folder"></i> 分类
                        </label>
                        <select class="form-select" id="category_id" name="category_id">
                            <option value="">请选择分类</option>
                            {% for category in categories %}
                            <option value="{{ category.id }}"
                                    {% if cd and cd.category_id == category.id %}selected{% endif %}>
                                {{ category.name }}
                            </option>
                            {% endfor %}
                        </select>
                        <div class="form-text">
                            未选择分类将显示为"未分类"
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">
                            <i class="bi bi-text-left"></i> 描述
                        </label>
                        <textarea class="form-control" id="description" name="description" 
                                  rows="4" placeholder="请输入CD描述信息">
                            {{- cd.description if cd else '' -}}
                        </textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="total_quantity" class="form-label">
                            <i class="bi bi-box"></i> 总数量
                        </label>
                        <input type="number" class="form-control" id="total_quantity" name="total_quantity" 
                               min="1" value="{{ cd.total_quantity if cd else 1 }}">
                        <div class="form-text">
                            该CD的总库存数量
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="/cds" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回列表
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> 
                            {% if action == 'create' %}保存CD{% else %}更新CD{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
