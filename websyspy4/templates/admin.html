<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租借预约系统 - 管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand text-warning" href="/admin">
                <i class="bi bi-gear me-2"></i>管理后台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i>返回前台</a>
                    </li>
                </ul>
                <ul class="navbar-nav" id="userNav">
                    <li class="nav-item">
                        <a class="nav-link" href="/login"><i class="bi bi-box-arrow-in-right me-1"></i>登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard" type="button">
                    <i class="bi bi-speedometer2 me-1"></i>仪表盘
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="reservations-tab" data-bs-toggle="tab" data-bs-target="#reservations" type="button">
                    <i class="bi bi-calendar-check me-1"></i>预约管理
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="products-tab" data-bs-toggle="tab" data-bs-target="#products" type="button">
                    <i class="bi bi-box me-1"></i>产品管理
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="categories-tab" data-bs-toggle="tab" data-bs-target="#categories" type="button">
                    <i class="bi bi-tags me-1"></i>分类管理
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="notifications-tab" data-bs-toggle="tab" data-bs-target="#notifications" type="button">
                    <i class="bi bi-bell me-1"></i>消息通知
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="exports-tab" data-bs-toggle="tab" data-bs-target="#exports" type="button">
                    <i class="bi bi-download me-1"></i>数据导出
                </button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabContent">
            <div class="tab-pane fade show active" id="dashboard">
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="card bg-primary text-white h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="card-title opacity-75">待处理预约</h6>
                                        <h2 class="mb-0" id="pendingCount">0</h2>
                                    </div>
                                    <i class="bi bi-clock-history display-4 opacity-50"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-success text-white h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="card-title opacity-75">进行中预约</h6>
                                        <h2 class="mb-0" id="activeCount">0</h2>
                                    </div>
                                    <i class="bi bi-arrow-repeat display-4 opacity-50"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-info text-white h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="card-title opacity-75">产品总数</h6>
                                        <h2 class="mb-0" id="productCount">0</h2>
                                    </div>
                                    <i class="bi bi-box display-4 opacity-50"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-warning text-dark h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="card-title opacity-75">未读通知</h6>
                                        <h2 class="mb-0" id="unreadCount">0</h2>
                                    </div>
                                    <i class="bi bi-bell display-4 opacity-50"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>最近预约</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th>预约单号</th>
                                        <th>用户</th>
                                        <th>产品</th>
                                        <th>日期</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="recentReservations">
                                    <tr>
                                        <td colspan="6" class="text-center py-4">
                                            <div class="spinner-border text-primary" role="status">
                                                <span class="visually-hidden">加载中...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="reservations">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <form id="reservationFilterForm" class="row g-3">
                            <div class="col-md-3">
                                <label for="adminStatusFilter" class="form-label">状态</label>
                                <select class="form-select" id="adminStatusFilter">
                                    <option value="">全部</option>
                                    <option value="pending">待确认</option>
                                    <option value="confirmed">已确认</option>
                                    <option value="paid">已支付押金</option>
                                    <option value="picked_up">已领取</option>
                                    <option value="returned">已归还</option>
                                    <option value="completed">已完成</option>
                                    <option value="cancelled">已取消</option>
                                </select>
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary me-2">筛选</button>
                                <button type="button" class="btn btn-outline-secondary" onclick="loadAdminReservations()">刷新</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th>预约单号</th>
                                        <th>用户</th>
                                        <th>产品</th>
                                        <th>开始日期</th>
                                        <th>结束日期</th>
                                        <th>总租金</th>
                                        <th>押金</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="adminReservationsBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="products">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">产品列表</h5>
                        <button class="btn btn-primary" onclick="showProductModal()">
                            <i class="bi bi-plus-circle me-1"></i>添加产品
                        </button>
                    </div>
                </div>
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>产品名称</th>
                                        <th>分类</th>
                                        <th>日租金</th>
                                        <th>押金</th>
                                        <th>库存</th>
                                        <th>状态</th>
                                        <th>热门</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="adminProductsBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="categories">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">分类列表</h5>
                        <button class="btn btn-primary" onclick="showCategoryModal()">
                            <i class="bi bi-plus-circle me-1"></i>添加分类
                        </button>
                    </div>
                </div>
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>分类名称</th>
                                        <th>描述</th>
                                        <th>排序</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="adminCategoriesBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="notifications">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">消息通知</h5>
                        <button class="btn btn-outline-primary" onclick="markAllAsRead()">
                            <i class="bi bi-check-all me-1"></i>全部标记已读
                        </button>
                    </div>
                </div>
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0" id="notificationsList">
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="exports">
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white">
                                <h6 class="mb-0"><i class="bi bi-calendar-check me-2"></i>预约数据导出</h6>
                            </div>
                            <div class="card-body">
                                <form id="exportReservationsForm">
                                    <div class="mb-3">
                                        <label class="form-label">开始日期</label>
                                        <input type="date" class="form-control" id="exportStartDate">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">结束日期</label>
                                        <input type="date" class="form-control" id="exportEndDate">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">状态（可选）</label>
                                        <select class="form-select" id="exportStatus">
                                            <option value="">全部状态</option>
                                            <option value="pending">待确认</option>
                                            <option value="confirmed">已确认</option>
                                            <option value="paid">已支付押金</option>
                                            <option value="picked_up">已领取</option>
                                            <option value="returned">已归还</option>
                                            <option value="completed">已完成</option>
                                            <option value="cancelled">已取消</option>
                                        </select>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="button" class="btn btn-primary" onclick="exportReservations()">
                                            <i class="bi bi-download me-1"></i>导出预约数据
                                        </button>
                                        <button type="button" class="btn btn-outline-primary" onclick="exportReservationStats()">
                                            <i class="bi bi-graph-up me-1"></i>导出统计数据
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white">
                                <h6 class="mb-0"><i class="bi bi-box me-2"></i>产品数据导出</h6>
                            </div>
                            <div class="card-body">
                                <form id="exportProductsForm">
                                    <div class="mb-3">
                                        <label class="form-label">分类（可选）</label>
                                        <select class="form-select" id="exportCategory">
                                            <option value="">全部分类</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">热门产品</label>
                                        <select class="form-select" id="exportHot">
                                            <option value="">全部</option>
                                            <option value="true">仅热门</option>
                                            <option value="false">仅非热门</option>
                                        </select>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="button" class="btn btn-primary" onclick="exportProducts()">
                                            <i class="bi bi-download me-1"></i>导出产品数据
                                        </button>
                                        <button type="button" class="btn btn-outline-primary" onclick="exportHotProducts()">
                                            <i class="bi bi-fire me-1"></i>导出热门产品
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary" onclick="exportCategories()">
                                            <i class="bi bi-tags me-1"></i>导出分类数据
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalTitle">添加产品</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="editProductId">
                        <div class="mb-3">
                            <label class="form-label">产品名称 *</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">分类 *</label>
                            <select class="form-select" id="productCategory" required>
                                <option value="">请选择分类</option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">日租金 *</label>
                                <input type="number" class="form-control" id="productDailyRent" step="0.01" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">押金 *</label>
                                <input type="number" class="form-control" id="productDeposit" step="0.01" min="0" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">库存数量 *</label>
                                <input type="number" class="form-control" id="productStock" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">可用数量</label>
                                <input type="number" class="form-control" id="productAvailable" min="0">
                                <small class="text-muted">不填则默认等于库存数量</small>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">描述</label>
                            <textarea class="form-control" id="productDescription" rows="3"></textarea>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">状态</label>
                                <select class="form-select" id="productStatus">
                                    <option value="1">上架</option>
                                    <option value="2">下架</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">是否热门</label>
                                <select class="form-select" id="productIsHot">
                                    <option value="false">否</option>
                                    <option value="true">是</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveProduct()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoryModalTitle">添加分类</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <input type="hidden" id="editCategoryId">
                        <div class="mb-3">
                            <label class="form-label">分类名称 *</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">描述</label>
                            <textarea class="form-control" id="categoryDescription" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">排序</label>
                            <input type="number" class="form-control" id="categorySortOrder" min="0" value="0">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveCategory()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 租借预约系统 - 管理后台. 保留所有权利.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        const toastEl = document.getElementById('toast');
        const toast = new bootstrap.Toast(toastEl);
        let allCategories = [];
        let allProducts = [];
        let allReservations = [];
        let productModal;
        let categoryModal;

        document.addEventListener('DOMContentLoaded', function() {
            productModal = new bootstrap.Modal(document.getElementById('productModal'));
            categoryModal = new bootstrap.Modal(document.getElementById('categoryModal'));
            
            if (!isLoggedIn()) {
                showToast('请先登录', true);
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
                return;
            }

            const user = getCurrentUser();
            if (user.role !== 'admin') {
                showToast('需要管理员权限', true);
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
                return;
            }

            updateNavigation();
            loadCategories();
            loadDashboard();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('reservationFilterForm').addEventListener('submit', function(e) {
                e.preventDefault();
                loadAdminReservations();
            });

            const tabTriggerList = [].slice.call(document.querySelectorAll('#adminTabs button[data-bs-toggle="tab"]'));
            tabTriggerList.forEach(function(tabTrigger) {
                tabTrigger.addEventListener('shown.bs.tab', function(event) {
                    const tabId = event.target.id;
                    if (tabId === 'reservations-tab') loadAdminReservations();
                    else if (tabId === 'products-tab') loadAdminProducts();
                    else if (tabId === 'categories-tab') loadAdminCategories();
                    else if (tabId === 'notifications-tab') loadNotifications();
                    else if (tabId === 'exports-tab') {
                        loadCategories();
                        populateExportCategorySelect();
                    }
                });
            });
        }

        function updateNavigation() {
            const user = getCurrentUser();
            const userNav = document.getElementById('userNav');
            
            if (user) {
                userNav.innerHTML = `
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i>${user.name || user.phone}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><h6 class="dropdown-header">${user.phone}</h6></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i class="bi bi-box-arrow-left me-2"></i>退出登录</a></li>
                        </ul>
                    </li>
                `;
            }
        }

        function showToast(message, isError = false) {
            const toastTitle = document.getElementById('toastTitle');
            const toastBody = document.getElementById('toastBody');
            toastTitle.textContent = isError ? '错误' : '成功';
            toastTitle.className = `me-auto ${isError ? 'text-danger' : 'text-success'}`;
            toastBody.textContent = message;
            toast.show();
        }

        function getStatusBadge(status) {
            const statusMap = {
                'pending': { class: 'bg-warning', text: '待确认' },
                'confirmed': { class: 'bg-info', text: '已确认' },
                'paid': { class: 'bg-primary', text: '已支付押金' },
                'picked_up': { class: 'bg-secondary', text: '已领取' },
                'returned': { class: 'bg-secondary', text: '已归还' },
                'completed': { class: 'bg-success', text: '已完成' },
                'cancelled': { class: 'bg-danger', text: '已取消' }
            };
            const s = statusMap[status] || { class: 'bg-secondary', text: status };
            return `<span class="badge ${s.class}">${s.text}</span>`;
        }

        async function loadCategories() {
            try {
                const response = await api.get('/api/categories/');
                allCategories = response.data;
                populateCategorySelects();
            } catch (error) {
                console.error('加载分类失败:', error);
            }
        }

        function populateCategorySelects() {
            const select = document.getElementById('productCategory');
            select.innerHTML = '<option value="">请选择分类</option>';
            allCategories.forEach(cat => {
                select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });
            populateExportCategorySelect();
        }

        function populateExportCategorySelect() {

        async function loadDashboard() {
            try {
                const [notificationsRes, reservationsRes, productsRes] = await Promise.all([
                    api.get('/api/notifications/unread-count'),
                    api.get('/api/reservations/'),
                    api.get('/api/products/')
                ]);

                allReservations = reservationsRes.data;
                allProducts = productsRes.data;

                let pendingCount = 0;
                let activeCount = 0;
                
                allReservations.forEach(r => {
                    if (r.status === 'pending') pendingCount++;
                    if (['confirmed', 'paid', 'picked_up', 'returned'].includes(r.status)) activeCount++;
                });

                document.getElementById('pendingCount').textContent = pendingCount;
                document.getElementById('activeCount').textContent = activeCount;
                document.getElementById('productCount').textContent = allProducts.length;
                document.getElementById('unreadCount').textContent = notificationsRes.data.unread_count;

                const recentReservations = allReservations.slice(0, 10);
                renderRecentReservations(recentReservations);

            } catch (error) {
                console.error('加载仪表盘失败:', error);
            }
        }

        function getAdminActionButtons(reservation) {
            let buttons = '';
            
            if (reservation.status === 'pending') {
                buttons += `<button class="btn btn-success" onclick="confirmReservation(${reservation.id})">确认</button>`;
            }
            
            if (reservation.status === 'confirmed' || reservation.status === 'paid') {
                buttons += `<button class="btn btn-info" onclick="pickupReservation(${reservation.id})">领取</button>`;
            }
            
            if (reservation.status === 'picked_up') {
                buttons += `<button class="btn btn-warning" onclick="returnReservation(${reservation.id})">归还</button>`;
            }
            
            if (reservation.status === 'returned') {
                buttons += `<button class="btn btn-success" onclick="completeReservation(${reservation.id})">完成</button>`;
            }
            
            if (reservation.status !== 'completed' && reservation.status !== 'cancelled') {
                buttons += `<button class="btn btn-danger" onclick="cancelReservation(${reservation.id})">取消</button>`;
            }
            
            return buttons;
        }

        function editProduct(id) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            document.getElementById('editProductId').value = id;
            document.getElementById('productModalTitle').textContent = '编辑产品';
            document.getElementById('productName').value = product.name;
            document.getElementById('productCategory').value = product.category_id || '';
            document.getElementById('productDailyRent').value = product.daily_rent;
            document.getElementById('productDeposit').value = product.deposit;
            document.getElementById('productStock').value = product.stock_quantity;
            document.getElementById('productAvailable').value = product.available_quantity;
            document.getElementById('productDescription').value = product.description || '';
            document.getElementById('productStatus').value = product.status;
            document.getElementById('productIsHot').value = product.is_hot;
            
            productModal.show();

        async function saveProduct() {
            const id = document.getElementById('editProductId').value;
            const data = {
                name: document.getElementById('productName').value,
                category_id: parseInt(document.getElementById('productCategory').value),
                daily_rent: parseFloat(document.getElementById('productDailyRent').value),
                deposit: parseFloat(document.getElementById('productDeposit').value),
                stock_quantity: parseInt(document.getElementById('productStock').value),
                available_quantity: parseInt(document.getElementById('productAvailable').value) || parseInt(document.getElementById('productStock').value),
                description: document.getElementById('productDescription').value,
                status: parseInt(document.getElementById('productStatus').value),
                is_hot: document.getElementById('productIsHot').value === 'true'
            };

            try {
                if (id) {
                    await api.put(`/api/products/${id}`, data);
                    showToast('产品更新成功');
                } else {
                    await api.post('/api/products/', data);
                    showToast('产品添加成功');
                }
                
                productModal.hide();
                loadAdminProducts();
                loadDashboard();
            } catch (error) {
                const errMsg = error.response?.data?.detail || '操作失败';
                showToast(errMsg, true);

        }

        function exportReservations() {
            const startDate = document.getElementById('exportStartDate').value;
            const endDate = document.getElementById('exportEndDate').value;
            const status = document.getElementById('exportStatus').value;
            
            let url = '/api/exports/reservations?';
            if (startDate) url += `start_date=${startDate}&`;
            if (endDate) url += `end_date=${endDate}&`;
            if (status) url += `status=${status}&`;
            
            const token = getAuthToken();
            const headers = new Headers();
            if (token) {
                headers.append('Authorization', `Bearer ${token}`);
            }
            
            fetch(url, { headers: headers })
                .then(response => response.blob())
                .then(blob => {
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = 'reservations_export.xlsx';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(downloadUrl);
                    document.body.removeChild(a);
                    showToast('导出成功');
                })
                .catch(error => {
                    console.error('导出失败:', error);
                    showToast('导出失败', true);
                });
        }
