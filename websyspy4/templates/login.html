<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租借预约系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                                <i class="bi bi-box-seam text-primary display-4"></i>
                            </div>
                            <h3 class="fw-bold">租借预约系统</h3>
                            <p class="text-muted">请登录您的账户</p>
                        </div>

                        <ul class="nav nav-pills nav-fill mb-4" id="authTabs">
                            <li class="nav-item">
                                <button class="nav-link active" id="loginTab" data-bs-toggle="pill" data-bs-target="#loginForm">
                                    登录
                                </button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" id="registerTab" data-bs-toggle="pill" data-bs-target="#registerForm">
                                    注册
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="loginForm">
                                <form id="loginFormEl">
                                    <div class="mb-3">
                                        <label for="loginPhone" class="form-label">手机号</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                            <input type="tel" class="form-control" id="loginPhone" placeholder="请输入手机号" maxlength="11" required>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="loginPassword" class="form-label">密码</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                            <input type="password" class="form-control" id="loginPassword" placeholder="请输入密码" required>
                                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('loginPassword')">
                                                <i class="bi bi-eye-slash" id="loginPasswordIcon"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                                            <i class="bi bi-box-arrow-in-right me-2"></i>登录
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <div class="tab-pane fade" id="registerForm">
                                <form id="registerFormEl">
                                    <div class="mb-3">
                                        <label for="registerPhone" class="form-label">手机号</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                            <input type="tel" class="form-control" id="registerPhone" placeholder="请输入手机号" maxlength="11" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="registerName" class="form-label">姓名（可选）</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                                            <input type="text" class="form-control" id="registerName" placeholder="请输入姓名">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="registerPassword" class="form-label">密码</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                            <input type="password" class="form-control" id="registerPassword" placeholder="请输入密码（至少6位）" required>
                                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('registerPassword')">
                                                <i class="bi bi-eye-slash" id="registerPasswordIcon"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="registerConfirmPassword" class="form-label">确认密码</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                            <input type="password" class="form-control" id="registerConfirmPassword" placeholder="请再次输入密码" required>
                                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('registerConfirmPassword')">
                                                <i class="bi bi-eye-slash" id="registerConfirmPasswordIcon"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-primary btn-lg" id="registerBtn">
                                            <i class="bi bi-person-plus me-2"></i>注册
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <a href="/" class="text-decoration-none">
                                <i class="bi bi-arrow-left me-1"></i>返回首页
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        const toastEl = document.getElementById('toast');
        const toast = new bootstrap.Toast(toastEl);

        function showToast(message, isError = false) {
            const toastTitle = document.getElementById('toastTitle');
            const toastBody = document.getElementById('toastBody');
            toastTitle.textContent = isError ? '错误' : '成功';
            toastTitle.className = `me-auto ${isError ? 'text-danger' : 'text-success'}`;
            toastBody.textContent = message;
            toast.show();
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + 'Icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye-slash';
            }
        }

        document.getElementById('loginFormEl').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            
            if (!phone || phone.length !== 11) {
                showToast('请输入正确的手机号', true);
                return;
            }
            if (!password) {
                showToast('请输入密码', true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>登录中...';

            try {
                const response = await api.post('/api/users/login-phone', {
                    phone: phone,
                    password: password
                });
                
                setAuthToken(response.data.access_token);
                setCurrentUser(response.data.user);
                showToast('登录成功！');
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } catch (error) {
                const errMsg = error.response?.data?.detail || '登录失败，请检查手机号和密码';
                showToast(errMsg, true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>登录';
            }
        });

        document.getElementById('registerFormEl').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('registerPhone').value.trim();
            const name = document.getElementById('registerName').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const btn = document.getElementById('registerBtn');

            if (!phone || phone.length !== 11) {
                showToast('请输入正确的手机号', true);
                return;
            }
            if (!password || password.length < 6) {
                showToast('密码至少6位', true);
                return;
            }
            if (password !== confirmPassword) {
                showToast('两次输入的密码不一致', true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>注册中...';

            try {
                const userData = {
                    phone: phone,
                    password: password
                };
                if (name) {
                    userData.name = name;
                }

                await api.post('/api/users/register', userData);
                showToast('注册成功！请登录');
                
                setTimeout(() => {
                    document.getElementById('loginTab').click();
                    document.getElementById('loginPhone').value = phone;
                }, 1000);
            } catch (error) {
                const errMsg = error.response?.data?.detail || '注册失败，请稍后重试';
                showToast(errMsg, true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>注册';
            }
        });
    </script>
</body>
</html>
