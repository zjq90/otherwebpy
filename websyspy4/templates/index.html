<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租借预约系统 - 首页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-box-seam me-2"></i>租借预约系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="bi bi-house-door me-1"></i>首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/products"><i class="bi bi-card-list me-1"></i>产品列表</a>
                    </li>
                </ul>
                <ul class="navbar-nav" id="userNav">
                    <li class="nav-item" id="loginNav">
                        <a class="nav-link" href="/login"><i class="bi bi-box-arrow-in-right me-1"></i>登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero-section py-5 bg-gradient-primary text-white">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <h1 class="display-4 fw-bold mb-4">便捷租借，轻松管理</h1>
                    <p class="lead mb-4">一站式租借预约平台，支持多种产品租借，在线预约，押金管理，让租借变得简单高效。</p>
                    <div class="d-flex gap-3">
                        <a href="/products" class="btn btn-light btn-lg">
                            <i class="bi bi-search me-2"></i>浏览产品
                        </a>
                        <a href="/login" class="btn btn-outline-light btn-lg">
                            <i class="bi bi-person-plus me-2"></i>立即登录
                        </a>
                    </div>
                </div>
                <div class="col-lg-6 d-none d-lg-block">
                    <div class="text-center">
                        <i class="bi bi-box-seam display-1 opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="text-center mb-5">
                <h2 class="fw-bold mb-3">热门租借产品</h2>
                <p class="text-muted">精选热门产品，满足您的租借需求</p>
            </div>
            <div class="row" id="hotProducts">
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5 bg-white">
        <div class="container">
            <div class="text-center mb-5">
                <h2 class="fw-bold mb-3">为什么选择我们</h2>
                <p class="text-muted">专业的租借服务，让您放心使用</p>
            </div>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm text-center p-4">
                        <div class="feature-icon bg-primary bg-opacity-10 rounded-circle mx-auto mb-3">
                            <i class="bi bi-shield-check text-primary"></i>
                        </div>
                        <h5 class="fw-bold mb-2">安全可靠</h5>
                        <p class="text-muted mb-0">完善的押金管理系统，保障双方权益</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm text-center p-4">
                        <div class="feature-icon bg-success bg-opacity-10 rounded-circle mx-auto mb-3">
                            <i class="bi bi-lightning-charge text-success"></i>
                        </div>
                        <h5 class="fw-bold mb-2">快速预约</h5>
                        <p class="text-muted mb-0">简单几步即可完成预约，高效便捷</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm text-center p-4">
                        <div class="feature-icon bg-info bg-opacity-10 rounded-circle mx-auto mb-3">
                            <i class="bi bi-bell text-info"></i>
                        </div>
                        <h5 class="fw-bold mb-2">实时通知</h5>
                        <p class="text-muted mb-0">预约状态实时更新，消息及时推送</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 租借预约系统. 保留所有权利.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            updateNavigation();
            loadHotProducts();
        });

        function updateNavigation() {
            const user = getCurrentUser();
            const userNav = document.getElementById('userNav');
            const loginNav = document.getElementById('loginNav');
            
            if (user) {
                let adminLink = '';
                if (user.role === 'admin') {
                    adminLink = `<li class="nav-item"><a class="nav-link" href="/admin"><i class="bi bi-gear me-1"></i>管理后台</a></li>`;
                }
                userNav.innerHTML = `
                    <li class="nav-item">
                        <a class="nav-link" href="/reservations"><i class="bi bi-calendar-check me-1"></i>我的预约</a>
                    </li>
                    ${adminLink}
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i>${user.name || user.phone}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><h6 class="dropdown-header">${user.phone}</h6></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()"><i class="bi bi-box-arrow-left me-2"></i>退出登录</a></li>
                        </ul>
                    </li>
                `;
            }
        }

        async function loadHotProducts() {
            try {
                const response = await api.get('/api/products/hot?limit=6');
                const products = response.data;
                const container = document.getElementById('hotProducts');
                
                if (products.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center">
                            <p class="text-muted">暂无热门产品</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = products.map(product => `
                    <div class="col-lg-4 col-md-6 mb-4">
                        <div class="card h-100 shadow-sm border-0 product-card">
                            <div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height: 200px;">
                                <i class="bi bi-box-seam display-1 text-primary opacity-50"></i>
                            </div>
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="card-title mb-0">${product.name}</h5>
                                    ${product.is_hot ? '<span class="badge bg-danger">热门</span>' : ''}
                                </div>
                                <p class="card-text text-muted small" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                                    ${product.description || '暂无描述'}
                                </p>
                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <div>
                                        <span class="text-primary fw-bold fs-5">¥${product.daily_rent}</span>
                                        <span class="text-muted small">/天</span>
                                    </div>
                                    <span class="text-muted small">押金: ¥${product.deposit}</span>
                                </div>
                            </div>
                            <div class="card-footer bg-white border-0">
                                <a href="/products" class="btn btn-outline-primary w-100">
                                    <i class="bi bi-eye me-1"></i>查看详情
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载热门产品失败:', error);
                document.getElementById('hotProducts').innerHTML = `
                    <div class="col-12 text-center">
                        <p class="text-muted">加载失败，请稍后重试</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
