{% extends "base.html" %}

{% block title %}分类管理 - 进销存管理系统{% endblock %}
{% block page_title %}分类管理{% endblock %}

{% block content %}

<!-- 工具栏 -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3 align-items-center">
            <div class="col-md-auto">
                <button class="btn btn-primary" onclick="openAddModal()">
                    <i class="bi bi-plus-lg me-2"></i>新增分类
                </button>
            </div>
            <div class="col-md-auto ms-auto">
                <button class="btn btn-outline-secondary" onclick="loadCategories()">
                    <i class="bi bi-arrow-repeat me-2"></i>刷新
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 分类列表 -->
<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th width="60">ID</th>
                        <th>分类名称</th>
                        <th>父分类</th>
                        <th>描述</th>
                        <th width="80">排序</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th width="150" class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="categoryTableBody">
                    <tr>
                        <td colspan="8" class="text-center py-5">
                            <div class="empty-state">
                                <i class="bi bi-tags"></i>
                                <p>暂无分类数据</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 新增/编辑分类模态框 -->
<div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="categoryModalTitle">新增分类</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="categoryForm">
                    <input type="hidden" id="categoryId">
                    <div class="mb-3">
                        <label class="form-label">分类名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="categoryName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">父分类</label>
                        <select class="form-select" id="parentId">
                            <option value="">无（顶级分类）</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">排序</label>
                        <input type="number" class="form-control" id="sortOrder" value="0" min="0">
                        <div class="form-text">数字越小越靠前</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">描述</label>
                        <textarea class="form-control" id="categoryDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3" id="categoryStatusField" style="display: none;">
                        <label class="form-label">状态</label>
                        <select class="form-select" id="categoryIsActive">
                            <option value="true">启用</option>
                            <option value="false">禁用</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveCategory()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 确认删除模态框 -->
<div class="modal fade" id="deleteCategoryModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除该分类吗？</p>
                <small class="text-muted">注意：存在子分类或关联产品的分类无法删除。</small>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteCategoryBtn">删除</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let allCategories = [];
let deleteCategoryId = null;

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
    loadCategories();
});

// 加载分类列表
async function loadCategories() {
    try {
        const result = await apiRequest('/api/categories');
        allCategories = result.items || [];
        renderCategoryTable(allCategories);
    } catch (error) {
        console.error('加载分类列表失败:', error);
    }
}

// 渲染分类表格
function renderCategoryTable(categories) {
    const tbody = document.getElementById('categoryTableBody');
    
    if (!categories || categories.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="text-center py-5">
                    <div class="empty-state">
                        <i class="bi bi-tags"></i>
                        <p>暂无分类数据，点击"新增分类"添加</p>
                    </div>
                </td>
            </tr>
        `;
        return;
    }
    
    tbody.innerHTML = categories.map(category => {
        const parentCategory = allCategories.find(c => c.id === category.parent_id);
        return `
        <tr>
            <td>${category.id}</td>
            <td><strong>${category.name}</strong></td>
            <td>${parentCategory ? parentCategory.name : '<span class="text-muted">-</span>'}</td>
            <td>${category.description || '<span class="text-muted">-</span>'}</td>
            <td>${category.sort_order}</td>
            <td>
                <span class="status-badge ${category.is_active ? 'status-active' : 'status-inactive'}">
                    ${category.is_active ? '启用' : '禁用'}
                </span>
            </td>
            <td>${formatDate(category.created_at)}</td>
            <td class="text-center">
                <button class="btn btn-sm btn-outline-primary" onclick="editCategory(${category.id})" title="编辑">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="confirmDeleteCategory(${category.id})" title="删除">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
    `}).join('');
}

// 填充父分类下拉框
function populateParentSelect(excludeId = null) {
    const select = document.getElementById('parentId');
    select.innerHTML = '<option value="">无（顶级分类）</option>';
    
    // 过滤掉当前编辑的分类及其所有子分类（防止循环引用）
    const availableCategories = allCategories.filter(c => c.id !== excludeId);
    
    availableCategories.forEach(category => {
        const option = document.createElement('option');
        option.value = category.id;
        option.textContent = category.name;
        select.appendChild(option);
    });
}

// 打开新增模态框
function openAddModal() {
    document.getElementById('categoryModalTitle').textContent = '新增分类';
    document.getElementById('categoryId').value = '';
    document.getElementById('categoryForm').reset();
    document.getElementById('sortOrder').value = '0';
    document.getElementById('categoryStatusField').style.display = 'none';
    
    populateParentSelect();
    
    const modal = new bootstrap.Modal(document.getElementById('categoryModal'));
    modal.show();
}

// 编辑分类
async function editCategory(categoryId) {
    try {
        const category = await apiRequest('/api/categories/' + categoryId);
        
        document.getElementById('categoryModalTitle').textContent = '编辑分类';
        document.getElementById('categoryId').value = category.id;
        document.getElementById('categoryName').value = category.name;
        document.getElementById('sortOrder').value = category.sort_order || 0;
        document.getElementById('categoryDescription').value = category.description || '';
        document.getElementById('categoryIsActive').value = category.is_active.toString();
        
        // 填充父分类下拉框（排除当前分类）
        populateParentSelect(category.id);
        
        // 设置父分类选中值
        document.getElementById('parentId').value = category.parent_id || '';
        
        document.getElementById('categoryStatusField').style.display = 'block';
        
        const modal = new bootstrap.Modal(document.getElementById('categoryModal'));
        modal.show();
    } catch (error) {
        console.error('加载分类信息失败:', error);
    }
}

// 保存分类
async function saveCategory() {
    const categoryId = document.getElementById('categoryId').value;
    const isEdit = categoryId !== '';
    
    const name = document.getElementById('categoryName').value.trim();
    if (!name) {
        showToast('请输入分类名称', 'warning');
        return;
    }
    
    const data = {
        name: name,
        parent_id: document.getElementById('parentId').value || null,
        sort_order: parseInt(document.getElementById('sortOrder').value) || 0,
        description: document.getElementById('categoryDescription').value || null
    };
    
    if (isEdit) {
        data.is_active = document.getElementById('categoryIsActive').value === 'true';
    }
    
    try {
        if (isEdit) {
            await apiRequest('/api/categories/' + categoryId, {
                method: 'PUT',
                body: JSON.stringify(data)
            });
            showToast('分类更新成功', 'success');
        } else {
            await apiRequest('/api/categories', {
                method: 'POST',
                body: JSON.stringify(data)
            });
            showToast('分类创建成功', 'success');
        }
        
        bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
        loadCategories();
    } catch (error) {
        console.error('保存分类失败:', error);
    }
}

// 确认删除分类
function confirmDeleteCategory(categoryId) {
    deleteCategoryId = categoryId;
    const modal = new bootstrap.Modal(document.getElementById('deleteCategoryModal'));
    modal.show();
}

// 绑定确认删除按钮
document.getElementById('confirmDeleteCategoryBtn').addEventListener('click', async function() {
    if (deleteCategoryId) {
        try {
            await apiRequest('/api/categories/' + deleteCategoryId, {
                method: 'DELETE'
            });
            showToast('分类删除成功', 'success');
            bootstrap.Modal.getInstance(document.getElementById('deleteCategoryModal')).hide();
            loadCategories();
        } catch (error) {
            console.error('删除分类失败:', error);
        }
    }
});
</script>
{% endblock %}
