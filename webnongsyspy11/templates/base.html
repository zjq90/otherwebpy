<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}农资管理系统{% endblock %}</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <h4><i class="fas fa-seedling mr-2"></i>农资管理</h4>
            <small>Agricultural Supply System</small>
        </div>
        
        <div class="nav-section">系统</div>
        <nav class="nav flex-column">
            <a class="nav-link {{ 'active' if active_menu == 'dashboard' else '' }}" href="/">
                <i class="fas fa-tachometer-alt"></i> 仪表盘
            </a>
        </nav>
        
        <div class="nav-section">基础数据</div>
        <nav class="nav flex-column">
            <a class="nav-link {{ 'active' if active_menu == 'suppliers' else '' }}" href="/suppliers">
                <i class="fas fa-truck"></i> 供应商管理
            </a>
            <a class="nav-link {{ 'active' if active_menu == 'categories' else '' }}" href="/categories">
                <i class="fas fa-tags"></i> 农资分类
            </a>
            <a class="nav-link {{ 'active' if active_menu == 'supplies' else '' }}" href="/supplies">
                <i class="fas fa-boxes"></i> 农资管理
            </a>
            <a class="nav-link {{ 'active' if active_menu == 'plots' else '' }}" href="/plots">
                <i class="fas fa-map-marked-alt"></i> 地块管理
            </a>
            <a class="nav-link {{ 'active' if active_menu == 'crops' else '' }}" href="/crops">
                <i class="fas fa-seedling"></i> 作物管理
            </a>
        </nav>
        
        <div class="nav-section">业务管理</div>
        <nav class="nav flex-column">
            <a class="nav-link {{ 'active' if active_menu == 'purchases' else '' }}" href="/purchases">
                <i class="fas fa-shopping-cart"></i> 采购管理
            </a>
            <a class="nav-link {{ 'active' if active_menu == 'inventory' else '' }}" href="/inventory">
                <i class="fas fa-warehouse"></i> 库存管理
            </a>
            <a class="nav-link {{ 'active' if active_menu == 'usage_records' else '' }}" href="/usage_records">
                <i class="fas fa-clipboard-list"></i> 使用记录
            </a>
        </nav>
    </div>
    
    <div class="main-content">
        <div class="top-nav">
            <h5 class="page-title">{% block page_title %}仪表盘{% endblock %}</h5>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    {% block breadcrumb %}{% endblock %}
                </ol>
            </nav>
        </div>
        
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="/static/js/common.js"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
