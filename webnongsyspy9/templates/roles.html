{% extends "base.html" %}

{% block title %}角色管理 - 农场管理系统{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
            <h3>
                <i class="fa fa-user-circle text-info mr-2"></i>角色管理
            </h3>
            <button type="button" class="btn btn-info text-white" data-toggle="modal" data-target="#roleModal">
                <i class="fa fa-plus mr-1"></i>添加角色
            </button>
        </div>
    </div>
</div>

<!-- 角色列表卡片 -->
<div class="card">
    <div class="card-body">
        <div class="row" id="roles-container">
            <div class="col-12 text-center text-muted">加载中...</div>
        </div>
    </div>
</div>

<!-- 添加/编辑角色模态框 -->
<div class="modal fade" id="roleModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="roleModalTitle">添加角色</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <form id="role-form">
                <input type="hidden" id="role-id" value="">
                <div class="modal-body">
                    <ul class="nav nav-tabs" id="roleTabs" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active" id="role-basic-tab" data-toggle="tab" href="#role-basic" role="tab">基本信息</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="role-permissions-tab" data-toggle="tab" href="#role-permissions" role="tab">权限配置</a>
                        </li>
                    </ul>
                    <div class="tab-content p-3 border border-top-0" id="roleTabsContent">
                        <!-- 基本信息标签页 -->
                        <div class="tab-pane fade show active" id="role-basic" role="tabpanel">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">角色名称 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="role-name" placeholder="如：部门经理" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">角色代码 <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="role-code" placeholder="如：dept_manager" required>
                                    <small class="text-muted">唯一标识，建议使用英文和下划线</small>
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label">角色描述</label>
                                    <textarea class="form-control" id="role-description" rows="2" placeholder="描述这个角色的职责范围"></textarea>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">排序顺序</label>
                                    <input type="number" class="form-control" id="role-sort-order" value="0" min="0">
                                    <small class="text-muted">数字越小越靠前</small>
                                </div>
                                <div class="col-md-8 mb-3">
                                    <div class="form-check mt-4">
                                        <input class="form-check-input" type="checkbox" id="role-is-default">
                                        <label class="form-check-label" for="role-is-default">
                                            设为默认角色（新员工自动分配此角色）
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 权限配置标签页 -->
                        <div class="tab-pane fade" id="role-permissions" role="tabpanel">
                            <div class="row">
                                <div class="col-12 mb-3">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h6 class="text-primary mb-0"><i class="fa fa-key mr-2"></i>权限列表</h6>
                                        <div class="btn-group btn-group-sm">
                                            <button type="button" class="btn btn-outline-secondary" onclick="selectAllRolePermissions()">全选</button>
                                            <button type="button" class="btn btn-outline-secondary" onclick="deselectAllRolePermissions()">清空</button>
                                        </div>
                                    </div>
                                    <div id="role-permissions-container" class="border rounded p-3">
                                        <div class="text-center text-muted">加载权限列表中...</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-info text-white">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 查看角色详情模态框 -->
<div class="modal fade" id="roleDetailModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">角色详情</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body" id="role-detail-body">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
/**
 * 角色管理页面JavaScript
 */

// 当前编辑的角色ID
let currentEditRoleId = null;
// 权限模块定义
let permissionModules = {};

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    loadRolePermissions();
    loadRoles();
    initRoleForm();
});

/**
 * 加载权限定义
 */
async function loadRolePermissions() {
    try {
        const data = await apiRequest('/api/roles/permissions');
        permissionModules = data.modules;
        renderRolePermissions();
    } catch (error) {
        console.error('加载权限定义失败:', error);
        document.getElementById('role-permissions-container').innerHTML = 
            '<div class="text-center text-danger">加载权限列表失败</div>';
    }
}

/**
 * 渲染角色权限选择界面
 */
function renderRolePermissions() {
    const container = document.getElementById('role-permissions-container');
    let html = '';
    
    for (const [moduleCode, moduleInfo] of Object.entries(permissionModules)) {
        html += `
            <div class="mb-4">
                <div class="d-flex align-items-center mb-2">
                    <label class="mb-0 mr-3">
                        <input type="checkbox" class="role-module-checkbox" data-module="${moduleCode}">
                    </label>
                    <i class="fa ${moduleInfo.icon} text-primary mr-2"></i>
                    <strong>${moduleInfo.name}</strong>
                </div>
                <div class="row ml-4">
                    ${moduleInfo.permissions.map(perm => `
                        <div class="col-6 col-md-4 mb-2">
                            <label class="mb-0">
                                <input type="checkbox" class="role-permission-checkbox" 
                                    data-module="${moduleCode}" 
                                    data-code="${perm.code}"
                                    title="${escapeHtml(perm.description)}">
                                <span class="ml-1" title="${escapeHtml(perm.description)}">
                                    ${escapeHtml(perm.name)}
                                </span>
                            </label>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    container.innerHTML = html;
    
    // 绑定模块全选事件
    document.querySelectorAll('.role-module-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            const moduleCode = this.dataset.module;
            const isChecked = this.checked;
            document.querySelectorAll(`.role-permission-checkbox[data-module="${moduleCode}"]`).forEach(perm => {
                perm.checked = isChecked;
            });
        });
    });
    
    // 绑定权限选择事件
    document.querySelectorAll('.role-permission-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', updateRoleModuleCheckbox);
    });
}

/**
 * 更新角色模块全选状态
 */
function updateRoleModuleCheckbox() {
    const moduleCode = this.dataset.module;
    const allPerms = document.querySelectorAll(`.role-permission-checkbox[data-module="${moduleCode}"]`);
    const checkedPerms = document.querySelectorAll(`.role-permission-checkbox[data-module="${moduleCode}"]:checked`);
    const moduleCheckbox = document.querySelector(`.role-module-checkbox[data-module="${moduleCode}"]`);
    
    if (moduleCheckbox) {
        moduleCheckbox.checked = allPerms.length > 0 && allPerms.length === checkedPerms.length;
        moduleCheckbox.indeterminate = checkedPerms.length > 0 && checkedPerms.length < allPerms.length;
    }
}

/**
 * 全选角色权限
 */
function selectAllRolePermissions() {
    document.querySelectorAll('.role-permission-checkbox').forEach(checkbox => {
        checkbox.checked = true;
    });
    document.querySelectorAll('.role-module-checkbox').forEach(checkbox => {
        checkbox.checked = true;
        checkbox.indeterminate = false;
    });
}

/**
 * 清空角色权限
 */
function deselectAllRolePermissions() {
    document.querySelectorAll('.role-permission-checkbox').forEach(checkbox => {
        checkbox.checked = false;
    });
    document.querySelectorAll('.role-module-checkbox').forEach(checkbox => {
        checkbox.checked = false;
        checkbox.indeterminate = false;
    });
}

/**
 * 获取选中的角色权限列表
 */
function getSelectedRolePermissions() {
    const checkboxes = document.querySelectorAll('.role-permission-checkbox:checked');
    const permissions = [];
    checkboxes.forEach(checkbox => {
        permissions.push(checkbox.dataset.code);
    });
    return permissions;
}

/**
 * 设置选中的角色权限
 */
function setSelectedRolePermissions(permissions) {
    if (!permissions || permissions.length === 0) {
        deselectAllRolePermissions();
        return;
    }
    
    deselectAllRolePermissions();
    
    permissions.forEach(permCode => {
        const checkbox = document.querySelector(`.role-permission-checkbox[data-code="${permCode}"]`);
        if (checkbox) {
            checkbox.checked = true;
            const event = new Event('change');
            checkbox.dispatchEvent(event);
        }
    });
}

/**
 * 加载角色列表
 */
async function loadRoles() {
    const container = document.getElementById('roles-container');
    
    try {
        const roles = await apiRequest('/api/roles/');
        
        if (roles.length === 0) {
            container.innerHTML = `
                <div class="col-12 text-center text-muted">
                    <div class="empty-state">
                        <i class="fa fa-user-circle"></i>
                        <p>暂无角色数据</p>
                    </div>
                </div>
            `;
            return;
        }
        
        container.innerHTML = roles.map(role => `
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <h5 class="card-title mb-1">
                                    <i class="fa fa-user-circle text-${role.is_system ? 'secondary' : 'info'} mr-2"></i>
                                    ${escapeHtml(role.name)}
                                    ${role.is_default ? '<span class="badge badge-success ml-2">默认</span>' : ''}
                                </h5>
                                <h6 class="card-subtitle text-muted">${escapeHtml(role.code)}</h6>
                            </div>
                            ${role.is_system ? 
                                '<span class="badge badge-secondary">系统预设</span>' : 
                                ''}
                        </div>
                        <p class="card-text text-muted mb-3">
                            ${escapeHtml(role.description || '暂无描述')}
                        </p>
                        <div class="mb-3">
                            <small class="text-muted">
                                <i class="fa fa-key mr-1"></i>权限数量: 
                                <strong>${role.permission_list ? role.permission_list.length : 0}</strong>
                            </small>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button class="btn btn-info btn-sm mr-2" onclick="viewRole(${role.id})">
                                <i class="fa fa-eye"></i>
                            </button>
                            <button class="btn btn-warning btn-sm text-white mr-2" onclick="loadRole(${role.id})">
                                <i class="fa fa-pencil"></i>
                            </button>
                            ${!role.is_system ? `
                                <button class="btn btn-danger btn-sm" onclick="deleteRole(${role.id})">
                                    <i class="fa fa-trash"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
        
    } catch (error) {
        showError('加载角色列表失败: ' + error.message);
        container.innerHTML = `
            <div class="col-12 text-center text-danger">
                加载失败，请刷新重试
            </div>
        `;
    }
}

/**
 * 初始化角色表单
 */
function initRoleForm() {
    const form = document.getElementById('role-form');
    
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const roleId = document.getElementById('role-id').value;
        
        // 获取选中的权限
        const selectedPerms = getSelectedRolePermissions();
        const permissionsStr = selectedPerms.length > 0 ? selectedPerms.join(',') : null;
        
        const roleData = {
            name: document.getElementById('role-name').value.trim(),
            code: document.getElementById('role-code').value.trim(),
            description: document.getElementById('role-description').value.trim() || null,
            permissions: permissionsStr,
            is_default: document.getElementById('role-is-default').checked,
            sort_order: parseInt(document.getElementById('role-sort-order').value) || 0
        };
        
        try {
            if (roleId) {
                await apiRequest(`/api/roles/${roleId}`, {
                    method: 'PUT',
                    body: JSON.stringify(roleData)
                });
                showSuccess('角色信息更新成功！');
            } else {
                await apiRequest('/api/roles/', {
                    method: 'POST',
                    body: JSON.stringify(roleData)
                });
                showSuccess('角色添加成功！');
            }
            
            $('#roleModal').modal('hide');
            loadRoles();
            
        } catch (error) {
            showError('操作失败: ' + error.message);
        }
    });
    
    $('#roleModal').on('hidden.bs.modal', function() {
        form.reset();
        document.getElementById('role-id').value = '';
        document.getElementById('roleModalTitle').textContent = '添加角色';
        currentEditRoleId = null;
        deselectAllRolePermissions();
        
        // 启用代码输入
        document.getElementById('role-code').disabled = false;
    });
}

/**
 * 加载角色信息到表单
 */
async function loadRole(id) {
    try {
        const role = await apiRequest(`/api/roles/${id}`);
        
        document.getElementById('role-id').value = role.id;
        document.getElementById('role-name').value = role.name;
        document.getElementById('role-code').value = role.code;
        document.getElementById('role-description').value = role.description || '';
        document.getElementById('role-sort-order').value = role.sort_order || 0;
        document.getElementById('role-is-default').checked = role.is_default || false;
        
        // 设置权限
        if (role.permission_list && role.permission_list.length > 0) {
            setSelectedRolePermissions(role.permission_list);
        }
        
        // 系统预设角色不能修改代码
        if (role.is_system) {
            document.getElementById('role-code').disabled = true;
        } else {
            document.getElementById('role-code').disabled = false;
        }
        
        document.getElementById('roleModalTitle').textContent = '编辑角色';
        $('#roleModal').modal('show');
        
    } catch (error) {
        showError('获取角色信息失败: ' + error.message);
    }
}

/**
 * 删除角色
 */
async function deleteRole(id) {
    const confirmed = await showConfirm('确定要删除这个角色吗？系统预设角色不可删除。');
    
    if (!confirmed) return;
    
    try {
        await apiRequest(`/api/roles/${id}`, {
            method: 'DELETE'
        });
        showSuccess('角色删除成功！');
        loadRoles();
        
    } catch (error) {
        showError('删除失败: ' + error.message);
    }
}

/**
 * 查看角色详情
 */
async function viewRole(id) {
    try {
        const role = await apiRequest(`/api/roles/${id}`);
        
        const detailBody = document.getElementById('role-detail-body');
        
        let permissionsHtml = '<span class="text-muted">暂无权限</span>';
        if (role.permission_list && role.permission_list.length > 0) {
            permissionsHtml = `
                <div class="row">
                    ${role.permission_list.map(p => `
                        <div class="col-6 col-md-4 mb-2">
                            <span class="badge badge-info">${escapeHtml(p)}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        detailBody.innerHTML = `
            <div class="row">
                <div class="col-md-6 mb-3">
                    <strong>角色名称:</strong> ${escapeHtml(role.name)}
                </div>
                <div class="col-md-6 mb-3">
                    <strong>角色代码:</strong> ${escapeHtml(role.code)}
                    ${role.is_system ? '<span class="badge badge-secondary ml-2">系统预设</span>' : ''}
                </div>
                <div class="col-md-6 mb-3">
                    <strong>默认角色:</strong> 
                    ${role.is_default ? 
                        '<span class="badge badge-success">是</span>' : 
                        '<span class="badge badge-secondary">否</span>'}
                </div>
                <div class="col-md-6 mb-3">
                    <strong>排序顺序:</strong> ${role.sort_order}
                </div>
                <div class="col-12 mb-3">
                    <strong>角色描述:</strong><br>
                    ${escapeHtml(role.description || '暂无描述')}
                </div>
                <div class="col-12 mb-3">
                    <strong>权限列表 (共 ${role.permission_list ? role.permission_list.length : 0} 个):</strong><br>
                    <div class="mt-2">
                        ${permissionsHtml}
                    </div>
                </div>
                <div class="col-md-6">
                    <strong>创建时间:</strong> ${formatDateTime(role.created_at)}
                </div>
                <div class="col-md-6">
                    <strong>更新时间:</strong> ${formatDateTime(role.updated_at)}
                </div>
            </div>
        `;
        
        $('#roleDetailModal').modal('show');
        
    } catch (error) {
        showError('获取角色详情失败: ' + error.message);
    }
}

/**
 * HTML转义
 */
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
