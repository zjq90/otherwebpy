{% extends "base.html" %}

{% block title %}地块管理 - 农场管理系统{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
            <h3>
                <i class="fa fa-map-marker text-info mr-2"></i>地块管理
            </h3>
            <button type="button" class="btn btn-info text-white" data-toggle="modal" data-target="#plotModal">
                <i class="fa fa-plus mr-1"></i>添加地块
            </button>
        </div>
    </div>
</div>

<!-- 数据列表卡片 -->
<div class="card">
    <div class="card-body">
        <div class="table-container">
            <table class="table table-hover" id="plot-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>地块编号</th>
                        <th>所属农场</th>
                        <th>面积(亩)</th>
                        <th>土壤类型</th>
                        <th>pH值</th>
                        <th>禁用农药</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="plot-tbody">
                    <tr>
                        <td colspan="8" class="text-center text-muted">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 添加/编辑地块模态框 -->
<div class="modal fade" id="plotModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="plotModalTitle">添加地块</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <form id="plot-form">
                <input type="hidden" id="plot-id" value="">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">地块编号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="plot-number" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">所属农场 <span class="text-danger">*</span></label>
                            <select class="form-control" id="plot-farm-id" required>
                                <option value="">加载中...</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">面积(亩) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" class="form-control" id="plot-area" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">土壤类型 <span class="text-danger">*</span></label>
                            <select class="form-control" id="plot-soil-type" required>
                                <option value="壤土">壤土</option>
                                <option value="砂土">砂土</option>
                                <option value="黏土">黏土</option>
                                <option value="淤泥">淤泥</option>
                                <option value="泥炭土">泥炭土</option>
                                <option value="白垩土">白垩土</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">pH值 <span class="text-danger">*</span></label>
                            <input type="number" step="0.1" min="0" max="14" class="form-control" id="plot-ph-value" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">禁用农药</label>
                            <div class="custom-control custom-checkbox mt-2">
                                <input type="checkbox" class="custom-control-input" id="plot-pesticide-prohibited">
                                <label class="custom-control-label" for="plot-pesticide-prohibited">是</label>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">地块位置</label>
                            <input type="text" class="form-control" id="plot-location">
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">种植历史</label>
                            <textarea class="form-control" id="plot-planting-history" rows="2"></textarea>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">轮作计划</label>
                            <textarea class="form-control" id="plot-rotation-plan" rows="2"></textarea>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" id="plot-remarks" rows="2"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-info text-white">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 查看详情模态框 -->
<div class="modal fade" id="plotDetailModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">地块详情</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body" id="plot-detail-body">
                <!-- 详情内容将通过JS动态填充 -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
/**
 * 地块管理页面JavaScript
 */

// 农场列表缓存
let farmsCache = [];

// 当前编辑的地块ID
let currentEditId = null;

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    loadFarms();
    loadPlots();
    initForm();
});

/**
 * 加载农场列表（用于下拉选择）
 */
async function loadFarms() {
    const select = document.getElementById('plot-farm-id');
    
    try {
        const farms = await apiRequest('/api/farms/');
        farmsCache = farms;
        
        if (farms.length === 0) {
            select.innerHTML = '<option value="">暂无农场，请先添加农场</option>';
            return;
        }
        
        select.innerHTML = `
            <option value="">请选择农场</option>
            ${farms.map(farm => `
                <option value="${farm.id}">${escapeHtml(farm.name)}</option>
            `).join('')}
        `;
        
    } catch (error) {
        console.error('加载农场列表失败:', error);
        select.innerHTML = '<option value="">加载失败</option>';
    }
}

/**
 * 加载地块列表
 */
async function loadPlots() {
    const tbody = document.getElementById('plot-tbody');
    
    try {
        const plots = await apiRequest('/api/plots/');
        
        if (plots.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" class="text-center text-muted">
                        <div class="empty-state">
                            <i class="fa fa-map-marker"></i>
                            <p>暂无地块数据</p>
                        </div>
                    </td>
                </tr>
            `;
            return;
        }
        
        tbody.innerHTML = plots.map(plot => `
            <tr>
                <td>${plot.id}</td>
                <td>${escapeHtml(plot.plot_number)}</td>
                <td>${getFarmName(plot.farm_id)}</td>
                <td>${plot.area}</td>
                <td>${escapeHtml(plot.soil_type)}</td>
                <td>${plot.ph_value}</td>
                <td>
                    ${plot.pesticide_prohibited ? 
                        '<span class="badge badge-danger">是</span>' : 
                        '<span class="badge badge-success">否</span>'}
                </td>
                <td class="action-buttons">
                    <button class="btn btn-info btn-sm" onclick="viewPlot(${plot.id})">
                        <i class="fa fa-eye"></i>
                    </button>
                    <button class="btn btn-warning btn-sm text-white" onclick="editPlot(${plot.id})">
                        <i class="fa fa-pencil"></i>
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="deletePlot(${plot.id})">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
        
    } catch (error) {
        showError('加载地块列表失败: ' + error.message);
        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="text-center text-danger">
                    加载失败，请刷新重试
                </td>
            </tr>
        `;
    }
}

/**
 * 根据农场ID获取农场名称
 */
function getFarmName(farmId) {
    const farm = farmsCache.find(f => f.id === farmId);
    return farm ? escapeHtml(farm.name) : `农场ID: ${farmId}`;
}

/**
 * 初始化表单
 */
function initForm() {
    const form = document.getElementById('plot-form');
    
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const plotId = document.getElementById('plot-id').value;
        const plotData = {
            plot_number: document.getElementById('plot-number').value.trim(),
            farm_id: parseInt(document.getElementById('plot-farm-id').value),
            area: parseFloat(document.getElementById('plot-area').value),
            soil_type: document.getElementById('plot-soil-type').value,
            ph_value: parseFloat(document.getElementById('plot-ph-value').value),
            pesticide_prohibited: document.getElementById('plot-pesticide-prohibited').checked,
            location: document.getElementById('plot-location').value.trim() || null,
            planting_history: document.getElementById('plot-planting-history').value.trim() || null,
            crop_rotation_plan: document.getElementById('plot-rotation-plan').value.trim() || null,
            remarks: document.getElementById('plot-remarks').value.trim() || null
        };
        
        try {
            if (plotId) {
                // 更新模式
                await apiRequest(`/api/plots/${plotId}`, {
                    method: 'PUT',
                    body: JSON.stringify(plotData)
                });
                showSuccess('地块信息更新成功！');
            } else {
                // 新增模式
                await apiRequest('/api/plots/', {
                    method: 'POST',
                    body: JSON.stringify(plotData)
                });
                showSuccess('地块添加成功！');
            }
            
            // 关闭模态框并刷新列表
            $('#plotModal').modal('hide');
            loadPlots();
            
        } catch (error) {
            showError('操作失败: ' + error.message);
        }
    });
    
    // 模态框隐藏时重置表单
    $('#plotModal').on('hidden.bs.modal', function() {
        form.reset();
        document.getElementById('plot-id').value = '';
        document.getElementById('plotModalTitle').textContent = '添加地块';
        currentEditId = null;
    });
}

/**
 * 编辑地块
 */
async function editPlot(id) {
    currentEditId = id;
    
    try {
        const plot = await apiRequest(`/api/plots/${id}`);
        
        // 填充表单
        document.getElementById('plot-id').value = plot.id;
        document.getElementById('plot-number').value = plot.plot_number;
        document.getElementById('plot-farm-id').value = plot.farm_id;
        document.getElementById('plot-area').value = plot.area;
        document.getElementById('plot-soil-type').value = plot.soil_type;
        document.getElementById('plot-ph-value').value = plot.ph_value;
        document.getElementById('plot-pesticide-prohibited').checked = plot.pesticide_prohibited;
        document.getElementById('plot-location').value = plot.location || '';
        document.getElementById('plot-planting-history').value = plot.planting_history || '';
        document.getElementById('plot-rotation-plan').value = plot.crop_rotation_plan || '';
        document.getElementById('plot-remarks').value = plot.remarks || '';
        
        document.getElementById('plotModalTitle').textContent = '编辑地块';
        $('#plotModal').modal('show');
        
    } catch (error) {
        showError('获取地块信息失败: ' + error.message);
    }
}

/**
 * 删除地块
 */
async function deletePlot(id) {
    const confirmed = await showConfirm('确定要删除这个地块吗？此操作不可恢复。');
    
    if (!confirmed) return;
    
    try {
        await apiRequest(`/api/plots/${id}`, {
            method: 'DELETE'
        });
        showSuccess('地块删除成功！');
        loadPlots();
        
    } catch (error) {
        showError('删除失败: ' + error.message);
    }
}

/**
 * 查看地块详情
 */
async function viewPlot(id) {
    try {
        const plot = await apiRequest(`/api/plots/${id}`);
        
        const detailBody = document.getElementById('plot-detail-body');
        detailBody.innerHTML = `
            <div class="row">
                <div class="col-md-6 mb-3">
                    <strong>地块编号:</strong> ${escapeHtml(plot.plot_number)}
                </div>
                <div class="col-md-6 mb-3">
                    <strong>所属农场:</strong> ${getFarmName(plot.farm_id)}
                </div>
                <div class="col-md-4 mb-3">
                    <strong>面积:</strong> ${plot.area} 亩
                </div>
                <div class="col-md-4 mb-3">
                    <strong>土壤类型:</strong> ${escapeHtml(plot.soil_type)}
                </div>
                <div class="col-md-4 mb-3">
                    <strong>pH值:</strong> ${plot.ph_value}
                </div>
                <div class="col-md-6 mb-3">
                    <strong>禁用农药:</strong> 
                    ${plot.pesticide_prohibited ? 
                        '<span class="badge badge-danger">是</span>' : 
                        '<span class="badge badge-success">否</span>'}
                </div>
                <div class="col-md-6 mb-3">
                    <strong>地块位置:</strong> ${escapeHtml(plot.location || '-')}
                </div>
                <div class="col-12 mb-3">
                    <strong>种植历史:</strong><br>
                    ${escapeHtml(plot.planting_history || '暂无记录')}
                </div>
                <div class="col-12 mb-3">
                    <strong>轮作计划:</strong><br>
                    ${escapeHtml(plot.crop_rotation_plan || '暂无计划')}
                </div>
                <div class="col-12 mb-3">
                    <strong>备注:</strong><br>
                    ${escapeHtml(plot.remarks || '暂无备注')}
                </div>
                <div class="col-md-6">
                    <strong>创建时间:</strong> ${formatDateTime(plot.created_at)}
                </div>
                <div class="col-md-6">
                    <strong>更新时间:</strong> ${formatDateTime(plot.updated_at)}
                </div>
            </div>
        `;
        
        $('#plotDetailModal').modal('show');
        
    } catch (error) {
        showError('获取地块详情失败: ' + error.message);
    }
}

/**
 * HTML转义
 */
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
