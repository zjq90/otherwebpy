{% extends "base.html" %}

{% block title %}系统测试 - 农场管理系统{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
            <h3>
                <i class="fa fa-flask text-info mr-2"></i>系统测试
            </h3>
            <div>
                <button type="button" class="btn btn-success mr-2" id="btn-generate-test-data">
                    <i class="fa fa-magic mr-1"></i>生成测试数据
                </button>
                <button type="button" class="btn btn-danger" id="btn-clear-data">
                    <i class="fa fa-trash mr-1"></i>清空数据
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 测试结果区域 -->
<div class="card mb-4">
    <div class="card-header">
        <i class="fa fa-list mr-1"></i>测试结果
    </div>
    <div class="card-body">
        <div id="test-results">
            <p class="text-muted text-center">点击上方按钮开始测试</p>
        </div>
    </div>
</div>

<!-- API测试区域 -->
<div class="card">
    <div class="card-header">
        <i class="fa fa-code mr-1"></i>API接口测试
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-3 mb-3">
                <button class="btn btn-outline-primary btn-block" onclick="testAPI('farms')">
                    <i class="fa fa-building mr-1"></i>农场API测试
                </button>
            </div>
            <div class="col-md-3 mb-3">
                <button class="btn btn-outline-info btn-block" onclick="testAPI('plots')">
                    <i class="fa fa-map-marker mr-1"></i>地块API测试
                </button>
            </div>
            <div class="col-md-3 mb-3">
                <button class="btn btn-outline-success btn-block" onclick="testAPI('crops')">
                    <i class="fa fa-tree mr-1"></i>作物API测试
                </button>
            </div>
            <div class="col-md-3 mb-3">
                <button class="btn btn-outline-warning btn-block text-dark" onclick="testAPI('staff')">
                    <i class="fa fa-users mr-1"></i>人员API测试
                </button>
            </div>
        </div>
        <div id="api-test-result" class="mt-3">
            <div class="alert alert-info">
                <i class="fa fa-info-circle mr-1"></i>点击上方按钮测试各个模块的API接口
            </div>
        </div>
    </div>
</div>

<!-- 测试日志区域 -->
<div class="card mt-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fa fa-file-text-o mr-1"></i>测试日志</span>
        <button type="button" class="btn btn-sm btn-secondary" onclick="clearLogs()">
            <i class="fa fa-refresh mr-1"></i>清空日志
        </button>
    </div>
    <div class="card-body">
        <pre id="test-logs" style="background: #f8f9fa; padding: 15px; border-radius: 5px; max-height: 400px; overflow-y: auto;">
等待测试开始...
        </pre>
    </div>
</div>
{% endblock %}

{% block extra_js %}

const testCrops = [

    { name: "西瓜", variety: "麒麟瓜", growth_cycle: 100, planting_season: "春季", harvest_season: "夏季", suitable_environment: "温度25-35℃，充足光照，排水良好", pest_disease_records: "常见病害：枯萎病、炭疽病；常见虫害：瓜蚜、红蜘蛛", fertilization_standard: "基肥：饼肥100kg/亩；追肥：磷酸二铵25kg/亩" },

    { staff_number: "EMP003", name: "张农工", gender: "女", age: 38, phone: "13800000003", position: "农工", department: "生产部", status: "在职" },

];

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    initButtons();
});

/**
 * 初始化按钮事件
 */
function initButtons() {
    // 生成测试数据按钮
    document.getElementById('btn-generate-test-data').addEventListener('click', async function() {
        const confirmed = await showConfirm('确定要生成测试数据吗？这将添加示例数据到数据库。');
        if (confirmed) {
            await generateTestData();
        }
    });
    
    // 清空数据按钮
    document.getElementById('btn-clear-data').addEventListener('click', async function() {
        const confirmed = await showConfirm('确定要清空所有数据吗？此操作不可恢复！');
        if (confirmed) {
            await clearAllData();
        }
    });
}

/**
 * 生成测试数据
 */
async function generateTestData() {
    const logs = document.getElementById('test-logs');
    const results = document.getElementById('test-results');
    
    let logContent = '========== 开始生成测试数据 ==========\n\n';
    let successCount = 0;
    let failCount = 0;
    
    try {
        // 1. 创建农场
        logContent += '【1/4】创建农场数据...\n';
        logs.textContent = logContent;
        
        const createdFarms = [];
        for (const farm of testFarms) {
            try {
                const result = await apiRequest('/api/farms/', {
                    method: 'POST',
                    body: JSON.stringify(farm)
                });
                createdFarms.push(result);
                logContent += `  ✓ 农场: ${farm.name}\n`;
                logs.textContent = logContent;
                successCount++;
            } catch (error) {
                logContent += `  ✗ 农场: ${farm.name} - ${error.message}\n`;
                logs.textContent = logContent;
                failCount++;
            }
        }
        
        // 2. 创建地块（关联第一个农场）
        logContent += '\n【2/4】创建地块数据...\n';
        logs.textContent = logContent;
        
        if (createdFarms.length > 0) {
            const farmId = createdFarms[0].id;
            for (const plot of testPlots) {
                try {
                    const plotData = { ...plot, farm_id: farmId };
                    await apiRequest('/api/plots/', {
                        method: 'POST',
                        body: JSON.stringify(plotData)
                    });
                    logContent += `  ✓ 地块: ${plot.plot_number}\n`;
                    logs.textContent = logContent;
                    successCount++;
                } catch (error) {
                    logContent += `  ✗ 地块: ${plot.plot_number} - ${error.message}\n`;
                    logs.textContent = logContent;
                    failCount++;
                }
            }
        }
        
        // 3. 创建作物
        logContent += '\n【3/4】创建作物数据...\n';
        logs.textContent = logContent;
        
        for (const crop of testCrops) {
            try {
                await apiRequest('/api/crops/', {
                    method: 'POST',
                    body: JSON.stringify(crop)
                });
                logContent += `  ✓ 作物: ${crop.name} - ${crop.variety}\n`;
                logs.textContent = logContent;
                successCount++;
            } catch (error) {
                logContent += `  ✗ 作物: ${crop.name} - ${error.message}\n`;
                logs.textContent = logContent;
                failCount++;
            }
        }
        
        // 4. 创建人员
        logContent += '\n【4/4】创建人员数据...\n';
        logs.textContent = logContent;
        
        for (const staff of testStaff) {
            try {
                await apiRequest('/api/staff/', {
                    method: 'POST',
                    body: JSON.stringify(staff)
                });
                logContent += `  ✓ 员工: ${staff.name}\n`;
                logs.textContent = logContent;
                successCount++;
            } catch (error) {
                logContent += `  ✗ 员工: ${staff.name} - ${error.message}\n`;
                logs.textContent = logContent;
                failCount++;
            }
        }
        
        logContent += '\n========== 测试数据生成完成 ==========\n';
        logContent += `成功: ${successCount} 项\n`;
        logContent += `失败: ${failCount} 项\n`;
        logs.textContent = logContent;
        
        // 更新结果显示
        results.innerHTML = `
            <div class="alert alert-success">
                <i class="fa fa-check-circle mr-2"></i>
                测试数据生成完成！
                <span class="ml-3">成功: <strong>${successCount}</strong> 项</span>
                <span class="ml-3">失败: <strong>${failCount}</strong> 项</span>
            </div>
        `;
        
        showSuccess('测试数据生成成功！');
        
    } catch (error) {
        logContent += `\n错误: ${error.message}\n`;
        logs.textContent = logContent;
        
        results.innerHTML = `
            <div class="alert alert-danger">
                <i class="fa fa-exclamation-circle mr-2"></i>
                生成测试数据时出错: ${error.message}
            </div>
        `;
        
        showError('生成测试数据失败！');
    }
}

/**
 * 清空所有数据
 */
async function clearAllData() {
    const logs = document.getElementById('test-logs');
    const results = document.getElementById('test-results');
    
    let logContent = '========== 开始清空数据 ==========\n\n';
    let deleteCount = 0;
    
    try {
        // 获取所有数据并删除
        const modules = ['farms', 'plots', 'crops', 'staff'];
        
        for (const module of modules) {
            logContent += `清空 ${module} 数据...\n`;
            logs.textContent = logContent;
            
            try {
                const items = await apiRequest(`/api/${module}/`);
                for (const item of items) {
                    try {
                        await apiRequest(`/api/${module}/${item.id}`, {
                            method: 'DELETE'
                        });
                        deleteCount++;
                    } catch (e) {
                        // 忽略删除错误
                    }
                }
            } catch (e) {
                logContent += `  获取 ${module} 数据失败: ${e.message}\n`;
            }
        }
        
        logContent += `\n========== 数据清空完成 ==========\n`;
        logContent += `已删除: ${deleteCount} 条记录\n`;
        logs.textContent = logContent;
        
        results.innerHTML = `
            <div class="alert alert-success">
                <i class="fa fa-check-circle mr-2"></i>
                数据清空完成！已删除 ${deleteCount} 条记录。
            </div>
        `;
        
        showSuccess('数据已清空！');
        
    } catch (error) {
        logContent += `\n错误: ${error.message}\n`;
        logs.textContent = logContent;
        
        results.innerHTML = `
            <div class="alert alert-danger">
                <i class="fa fa-exclamation-circle mr-2"></i>
                清空数据时出错: ${error.message}
            </div>
        `;
        
        showError('清空数据失败！');
    }
}

/**
 * 测试API接口
 */
async function testAPI(module) {
    const resultDiv = document.getElementById('api-test-result');
    const logs = document.getElementById('test-logs');
    
    const moduleNames = {
        'farms': '农场',
        'plots': '地块',
        'crops': '作物',
        'staff': '人员'
    };
    
    resultDiv.innerHTML = `
        <div class="alert alert-info">
            <i class="fa fa-spinner fa-spin mr-2"></i>
            正在测试 ${moduleNames[module]} API...
        </div>
    `;
    
    let logContent = logs.textContent + `\n\n========== 测试 ${moduleNames[module]} API ==========\n`;
    let testResults = [];
    
    try {
        // 测试1: 获取列表
        logContent += `测试1: 获取列表 - GET /api/${module}/\n`;
        logs.textContent = logContent;
        
        const startTime = performance.now();
        const listResult = await apiRequest(`/api/${module}/`);
        const listTime = (performance.now() - startTime).toFixed(2);
        
        testResults.push({
            name: '获取列表',
            status: 'success',
            message: `返回 ${listResult.length} 条记录，耗时 ${listTime}ms`
        });
        logContent += `  ✓ 成功，返回 ${listResult.length} 条记录，耗时 ${listTime}ms\n`;
        logs.textContent = logContent;
        
        // 测试2: 获取统计
        logContent += `测试2: 获取统计 - GET /api/${module}/count\n`;
        logs.textContent = logContent;
        
        const countResult = await apiRequest(`/api/${module}/count`);
        
        testResults.push({
            name: '获取统计',
            status: 'success',
            message: `总数: ${countResult}`
        });
        logContent += `  ✓ 成功，总数: ${countResult}\n`;
        logs.textContent = logContent;
        
        // 显示结果
        const successCount = testResults.filter(r => r.status === 'success').length;
        
        resultDiv.innerHTML = `
            <div class="alert alert-success">
                <h5><i class="fa fa-check-circle mr-2"></i>${moduleNames[module]} API 测试通过</h5>
                <table class="table table-sm mt-3 mb-0">
                    <thead>
                        <tr>
                            <th>测试项</th>
                            <th>状态</th>
                            <th>结果</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${testResults.map(r => `
                            <tr>
                                <td>${r.name}</td>
                                <td><span class="badge badge-success">成功</span></td>
                                <td>${r.message}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
        
    } catch (error) {
        logContent += `  ✗ 失败: ${error.message}\n`;
        logs.textContent = logContent;
        
        resultDiv.innerHTML = `
            <div class="alert alert-danger">
                <i class="fa fa-exclamation-circle mr-2"></i>
                API 测试失败: ${error.message}
            </div>
        `;
        
        showError('API测试失败！');
    }
}

/**
 * 清空日志
 */
function clearLogs() {
    document.getElementById('test-logs').textContent = '等待测试开始...\n';
}
</script>
{% endblock %}
