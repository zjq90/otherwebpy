<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}农场管理系统{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand text-primary" href="/">
                <i class="fa fa-leaf mr-2"></i>农场管理系统
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                            <i class="fa fa-home mr-1"></i>首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/farms' %}active{% endif %}" href="/farms">
                            <i class="fa fa-building mr-1"></i>农场信息
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/plots' %}active{% endif %}" href="/plots">
                            <i class="fa fa-map-marker mr-1"></i>地块管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/crops' %}active{% endif %}" href="/crops">
                            <i class="fa fa-tree mr-1"></i>作物档案
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle {% if request.url.path == '/staff' or request.url.path == '/roles' %}active{% endif %}" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                            <i class="fa fa-users mr-1"></i>人员管理
                        </a>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="/staff">
                                <i class="fa fa-user mr-2"></i>员工列表
                            </a>
                            <a class="dropdown-item" href="/roles">
                                <i class="fa fa-user-circle mr-2"></i>角色管理
                            </a>
                        </div>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/test' %}active{% endif %}" href="/test">
                            <i class="fa fa-flask mr-1"></i>测试
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <div class="container main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- 页脚 -->
    <footer class="footer mt-auto">
        <div class="container text-center text-muted">
            <p class="mb-0">&copy; 2024 农场管理系统. 保留所有权利.</p>
        </div>
    </footer>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 通用工具函数 -->
    <script src="/static/js/common.js"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
