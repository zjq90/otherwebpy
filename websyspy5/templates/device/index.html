{% extends "base.html" %}

{% block title %}门禁设备管理 - 门禁考勤管理系统{% endblock %}
{% block page_title %}门禁设备管理{% endblock %}

{% block content %}
<!-- 搜索和添加区域 -->
<div class="search-card">
    <form id="searchForm">
        <div class="row align-items-end">
            <div class="col-md-3">
                <label class="form-label">关键字搜索</label>
                <input type="text" class="form-control" id="keyword" placeholder="设备编号/名称/IP">
            </div>
            <div class="col-md-2">
                <label class="form-label">位置</label>
                <select class="form-select" id="location">
                    <option value="">全部</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">状态</label>
                <select class="form-select" id="status">
                    <option value="">全部</option>
                    <option value="1">在线</option>
                    <option value="0">离线</option>
                    <option value="2">故障</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-search me-1"></i>搜索
                </button>
            </div>
            <div class="col-md-3 text-end">
                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">
                    <i class="bi bi-plus-lg me-1"></i>添加设备
                </button>
            </div>
        </div>
    </form>
</div>

<!-- 数据列表 -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-camera-video me-2"></i>设备列表</span>
        <span class="text-muted">共 <span id="totalCount">0</span> 条记录</span>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>设备编号</th>
                        <th>设备名称</th>
                        <th>设备型号</th>
                        <th>位置</th>
                        <th>IP地址</th>
                        <th>MAC地址</th>
                        <th>状态</th>
                        <th>最后在线时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="deviceTable">
                    <tr>
                        <td colspan="9" class="text-center text-muted">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- 分页 -->
        <div class="d-flex justify-content-center mt-4" id="pagination">
        </div>
    </div>
</div>

<!-- 添加/编辑模态框 -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">添加门禁设备</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="deviceForm">
                <input type="hidden" id="editId">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">设备编号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="device_no" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">设备名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="device_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">设备型号</label>
                            <input type="text" class="form-control" id="device_model">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">设备位置</label>
                            <input type="text" class="form-control" id="locationInput" placeholder="如：大门入口、办公区A门">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">IP地址</label>
                            <input type="text" class="form-control" id="ip_address" placeholder="如：192.168.1.100">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">MAC地址</label>
                            <input type="text" class="form-control" id="mac_address" placeholder="如：00:11:22:33:44:55">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">状态</label>
                            <select class="form-select" id="statusSelect">
                                <option value="1">在线</option>
                                <option value="0">离线</option>
                                <option value="2">故障</option>
                            </select>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" id="remark" rows="2"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentPage = 1;
    let pageSize = 10;
    
    // 加载位置列表
    async function loadLocations() {
        try {
            const response = await apiRequest('/api/device/locations/all');
            if (response.code === 200 && response.data) {
                const select = document.getElementById('location');
                response.data.forEach(loc => {
                    const option = document.createElement('option');
                    option.value = loc;
                    option.textContent = loc;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            console.error('加载位置列表失败:', error);
        }
    }
    
    // 加载设备列表
    async function loadDeviceList() {
        showLoading();
        try {
            const keyword = document.getElementById('keyword').value;
            const location = document.getElementById('location').value;
            const status = document.getElementById('status').value;
            
            let url = `/api/device/list?page=${currentPage}&page_size=${pageSize}`;
            if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
            if (location) url += `&location=${encodeURIComponent(location)}`;
            if (status) url += `&status=${status}`;
            
            const response = await apiRequest(url);
            if (response.code === 200) {
                renderDeviceTable(response.data.list);
                document.getElementById('totalCount').textContent = response.data.total;
                
                const totalPages = Math.ceil(response.data.total / pageSize);
                renderPagination(totalPages);
            }
        } catch (error) {
            console.error('加载列表失败:', error);
        } finally {
            hideLoading();
        }
    }
    
    // 渲染表格
    function renderDeviceTable(list) {
        const tbody = document.getElementById('deviceTable');
        
        if (!list || list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">暂无数据</td></tr>';
            return;
        }
        
        let html = '';
        list.forEach(device => {
            let statusClass = 'bg-secondary';
            if (device.status === 1) statusClass = 'bg-success';
            else if (device.status === 2) statusClass = 'bg-warning';
            
            html += `
                <tr>
                    <td>${device.device_no}</td>
                    <td>${device.device_name}</td>
                    <td>${device.device_model || '-'}</td>
                    <td>${device.location || '-'}</td>
                    <td>${device.ip_address || '-'}</td>
                    <td>${device.mac_address || '-'}</td>
                    <td><span class="badge ${statusClass}">${device.status_text}</span></td>
                    <td>${formatDateTime(device.last_online_time)}</td>
                    <td>
                        <button class="btn btn-sm btn-primary btn-action" onclick="editDevice(${device.id})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-danger btn-action" onclick="deleteDevice(${device.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
        
        tbody.innerHTML = html;
    }
    
    // 渲染分页
    function renderPagination(totalPages) {
        const container = document.getElementById('pagination');
        container.innerHTML = renderPaginationHtml(currentPage, totalPages);
        
        container.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const page = parseInt(this.dataset.page);
                if (page && page !== currentPage) {
                    currentPage = page;
                    loadDeviceList();
                }
            });
        });
    }
    
    // 编辑设备
    async function editDevice(id) {
        showLoading();
        try {
            const response = await apiRequest(`/api/device/${id}`);
            if (response.code === 200) {
                const device = response.data;
                document.getElementById('editId').value = id;
                document.getElementById('modalTitle').textContent = '编辑门禁设备';
                document.getElementById('device_no').value = device.device_no;
                document.getElementById('device_name').value = device.device_name || '';
                document.getElementById('device_model').value = device.device_model || '';
                document.getElementById('locationInput').value = device.location || '';
                document.getElementById('ip_address').value = device.ip_address || '';
                document.getElementById('mac_address').value = device.mac_address || '';
                document.getElementById('statusSelect').value = device.status;
                document.getElementById('remark').value = device.remark || '';
                
                new bootstrap.Modal(document.getElementById('addModal')).show();
            }
        } catch (error) {
            console.error('获取详情失败:', error);
            showToast('获取详情失败', 'error');
        } finally {
            hideLoading();
        }
    }
    
    // 删除设备
    async function deleteDevice(id) {
        if (!confirm('确定要删除该设备吗？')) return;
        
        showLoading();
        try {
            const response = await apiRequest(`/api/device/${id}`, {
                method: 'DELETE'
            });
            
            if (response.code === 200) {
                showToast('删除成功');
                loadDeviceList();
            } else {
                showToast(response.message || '删除失败', 'error');
            }
        } catch (error) {
            console.error('删除失败:', error);
            showToast('删除失败', 'error');
        } finally {
            hideLoading();
        }
    }
    
    // 提交表单
    async function submitDeviceForm(event) {
        event.preventDefault();
        
        const editId = document.getElementById('editId').value;
        const data = {
            device_no: document.getElementById('device_no').value,
            device_name: document.getElementById('device_name').value,
            device_model: document.getElementById('device_model').value || null,
            location: document.getElementById('locationInput').value || null,
            ip_address: document.getElementById('ip_address').value || null,
            mac_address: document.getElementById('mac_address').value || null,
            status: parseInt(document.getElementById('statusSelect').value),
            remark: document.getElementById('remark').value || null
        };
        
        showLoading();
        try {
            let url = '/api/device/create';
            let method = 'POST';
            
            if (editId) {
                url = `/api/device/${editId}`;
                method = 'PUT';
                // 编辑时移除device_no（后端不允许修改）
                delete data.device_no;
            }
            
            const response = await apiRequest(url, {
                method: method,
                body: JSON.stringify(data)
            });
            
            if (response.code === 200) {
                showToast(editId ? '更新成功' : '添加成功');
                bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                resetForm();
                loadDeviceList();
            } else {
                showToast(response.detail || response.message || '操作失败', 'error');
            }
        } catch (error) {
            console.error('提交失败:', error);
            showToast('提交失败', 'error');
        } finally {
            hideLoading();
        }
    }
    
    // 重置表单
    function resetForm() {
        document.getElementById('deviceForm').reset();
        document.getElementById('editId').value = '';
        document.getElementById('modalTitle').textContent = '添加门禁设备';
    }
    
    // 模态框隐藏时重置表单
    document.getElementById('addModal').addEventListener('hidden.bs.modal', resetForm);
    
    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', function() {
        loadLocations();
        loadDeviceList();
        
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            currentPage = 1;
            loadDeviceList();
        });
        
        document.getElementById('deviceForm').addEventListener('submit', submitDeviceForm);
    });
</script>
{% endblock %}
