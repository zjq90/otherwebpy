{% extends "base.html" %}

{% block title %}注册 - 企业展示系统{% endblock %}

{% block extra_css %}
<style>
    .register-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }
    
    .register-card {
        max-width: 500px;
        width: 100%;
    }
    
    .password-strength {
        height: 4px;
        margin-top: 8px;
        border-radius: 2px;
        background: #e2e8f0;
        overflow: hidden;
    }
    
    .password-strength-bar {
        height: 100%;
        width: 0%;
        transition: width 0.3s ease, background-color 0.3s ease;
    }
    
    .strength-weak { width: 33%; background: #ef4444; }
    .strength-medium { width: 66%; background: #f59e0b; }
    .strength-strong { width: 100%; background: #10b981; }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus text-primary display-3"></i>
                    <h3 class="fw-bold mt-3">用户注册</h3>
                    <p class="text-muted">创建您的账号，开始使用我们的服务</p>
                </div>
                
                <form id="registerForm">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="username" class="form-label fw-medium">
                                <i class="bi bi-person me-1"></i>用户名 <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="username" 
                                   name="username" placeholder="请输入用户名（3-50个字符）" 
                                   required minlength="3" maxlength="50">
                            <div class="form-text">用户名长度3-50个字符，用于登录</div>
                        </div>
                        
                        <div class="col-12">
                            <label for="email" class="form-label fw-medium">
                                <i class="bi bi-envelope me-1"></i>邮箱地址 <span class="text-danger">*</span>
                            </label>
                            <input type="email" class="form-control" id="email" 
                                   name="email" placeholder="请输入有效的邮箱地址" required>
                            <div class="form-text">用于找回密码和接收重要通知</div>
                        </div>
                        
                        <div class="col-12">
                            <label for="fullName" class="form-label fw-medium">
                                <i class="bi bi-person-badge me-1"></i>真实姓名
                            </label>
                            <input type="text" class="form-control" id="fullName" 
                                   name="fullName" placeholder="请输入您的真实姓名">
                        </div>
                        
                        <div class="col-12">
                            <label for="phone" class="form-label fw-medium">
                                <i class="bi bi-telephone me-1"></i>手机号
                            </label>
                            <input type="tel" class="form-control" id="phone" 
                                   name="phone" placeholder="请输入11位中国大陆手机号（如：13800138000）"
                                   maxlength="11"
                                   oninput="validatePhone(this)">
                            <div class="form-text">
                                <span id="phoneStatus">请输入11位中国大陆手机号（可选）</span>
                            </div>
                            <div id="phoneError" class="invalid-feedback d-block" style="display:none;"></div>
                        </div>
                        
                        <div class="col-12">
                            <label for="password" class="form-label fw-medium">
                                <i class="bi bi-lock me-1"></i>密码 <span class="text-danger">*</span>
                            </label>
                            <div class="position-relative">
                                <input type="password" class="form-control" id="password" 
                                       name="password" placeholder="请输入密码（6-64个字符）" 
                                       required minlength="6" maxlength="64" oninput="checkPasswordStrength(this.value)">
                                <button type="button" class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted"
                                        onclick="togglePassword('password')">
                                    <i class="bi bi-eye" id="password-icon"></i>
                                </button>
                            </div>
                            <div class="password-strength">
                                <div class="password-strength-bar" id="passwordStrengthBar"></div>
                            </div>
                            <div class="form-text" id="passwordStrengthText">
                                密码强度：未输入
                            </div>
                        </div>
                        
                        <div class="col-12">
                            <label for="confirmPassword" class="form-label fw-medium">
                                <i class="bi bi-lock-fill me-1"></i>确认密码 <span class="text-danger">*</span>
                            </label>
                            <div class="position-relative">
                                <input type="password" class="form-control" id="confirmPassword" 
                                       name="confirmPassword" placeholder="请再次输入密码" 
                                       required minlength="6" maxlength="64">
                                <button type="button" class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted"
                                        onclick="togglePassword('confirmPassword')">
                                    <i class="bi bi-eye" id="confirmPassword-icon"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="col-12">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                                <label class="form-check-label" for="agreeTerms">
                                    我已阅读并同意 <a href="#" class="text-primary text-decoration-none">服务条款</a> 
                                    和 <a href="#" class="text-primary text-decoration-none">隐私政策</a>
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="registerBtn">
                            <span class="spinner me-2 d-none" id="registerSpinner"></span>
                            注册
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="mb-0">已有账号？
                        <a href="/login" class="text-primary fw-bold text-decoration-none">立即登录</a>
                    </p>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a href="/home" class="text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>返回首页
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const PHONE_REGEX = /^1[3-9]\d{9}$/;
    
    function validatePhone(input) {
        const phone = input.value.trim();
        const phoneStatus = document.getElementById('phoneStatus');
        const phoneError = document.getElementById('phoneError');
        
        input.classList.remove('is-valid', 'is-invalid');
        phoneStatus.className = 'form-text';
        phoneError.style.display = 'none';
        
        if (!phone) {
            phoneStatus.textContent = '请输入11位中国大陆手机号（可选）';
            phoneStatus.className = 'form-text';
            return true;
        }
        
        const cleanPhone = phone.replace(/\D/g, '');
        if (cleanPhone.length !== 11) {
            input.classList.add('is-invalid');
            phoneStatus.textContent = '';
            phoneError.style.display = 'block';
            phoneError.textContent = '手机号必须为11位数字';
            return false;
        }
        
        if (!PHONE_REGEX.test(cleanPhone)) {
            input.classList.add('is-invalid');
            phoneStatus.textContent = '';
            phoneError.style.display = 'block';
            phoneError.textContent = '请输入有效的中国大陆手机号（必须以13-19开头）';
            return false;
        }
        
        input.classList.add('is-valid');
        input.value = cleanPhone;
        phoneStatus.textContent = '✓ 手机号格式正确';
        phoneStatus.className = 'form-text text-success';
        
        return true;
    }
    
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(inputId + '-icon');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
    
    // 检查密码强度
    function checkPasswordStrength(password) {
        const strengthBar = document.getElementById('passwordStrengthBar');
        const strengthText = document.getElementById('passwordStrengthText');
        
        strengthBar.className = 'password-strength-bar';
        
        if (!password) {
            strengthText.textContent = '密码强度：未输入';
            return;
        }
        
        let score = 0;
        if (password.length >= 6) score++;
        if (password.length >= 10) score++;
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
        if (/\d/.test(password)) score++;
        if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) score++;
        
        if (score <= 2) {
            strengthBar.classList.add('strength-weak');
            strengthText.textContent = '密码强度：弱';
            strengthText.className = 'form-text text-danger';
        } else if (score <= 3) {
            strengthBar.classList.add('strength-medium');
            strengthText.textContent = '密码强度：中等';
            strengthText.className = 'form-text text-warning';
        } else {
            strengthBar.classList.add('strength-strong');
            strengthText.textContent = '密码强度：强';
            strengthText.className = 'form-text text-success';
        }
    }
    
    // 注册表单提交
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        const phoneInput = document.getElementById('phone');
        if (!validatePhone(phoneInput)) {
            showMessage('请输入正确的手机号格式', 'error');
            return;
        }
        
        if (password !== confirmPassword) {
            showMessage('两次输入的密码不一致', 'error');
            return;
        }
        
        const registerBtn = document.getElementById('registerBtn');
        const registerSpinner = document.getElementById('registerSpinner');
        
        // 显示加载状态
        registerBtn.disabled = true;
        registerSpinner.classList.remove('d-none');
        
        try {
            const userData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                full_name: document.getElementById('fullName').value || null,
                phone: document.getElementById('phone').value || null,
                password: password
            };
            
            const response = await fetch(`${API_BASE}/auth/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(userData)
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || '注册失败');
            }
            
            const data = await response.json();
            
            showMessage('注册成功！请登录', 'success');
            
            // 延迟跳转到登录页
            setTimeout(() => {
                window.location.href = '/login';
            }, 1500);
            
        } catch (error) {
            console.error('注册错误:', error);
            showMessage(error.message || '注册失败，请重试', 'error');
        } finally {
            registerBtn.disabled = false;
            registerSpinner.classList.add('d-none');
        }
    });
</script>
{% endblock %}
