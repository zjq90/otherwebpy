{% extends "base.html" %}

{% block title %}登录 - 企业展示系统{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }
    
    .login-card {
        max-width: 450px;
        width: 100%;
    }
    
    .social-login-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        transition: all 0.3s ease;
        text-decoration: none;
        color: var(--text-dark);
    }
    
    .social-login-btn:hover {
        background: var(--bg-light);
        border-color: var(--primary-color);
    }
    
    .divider {
        display: flex;
        align-items: center;
        text-align: center;
        color: var(--text-light);
        margin: 1.5rem 0;
    }
    
    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #e2e8f0;
    }
    
    .divider:not(:empty)::before {
        margin-right: 1rem;
    }
    
    .divider:not(:empty)::after {
        margin-left: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-building text-primary display-3"></i>
                    <h3 class="fw-bold mt-3">用户登录</h3>
                    <p class="text-muted">欢迎回来，请登录您的账号</p>
                </div>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium">
                            <i class="bi bi-person me-1"></i>用户名
                        </label>
                        <input type="text" class="form-control" id="username" 
                               name="username" placeholder="请输入用户名" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label fw-medium">
                            <i class="bi bi-lock me-1"></i>密码
                        </label>
                        <div class="position-relative">
                            <input type="password" class="form-control" id="password" 
                                   name="password" placeholder="请输入密码" required>
                            <button type="button" class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted"
                                    onclick="togglePassword('password')">
                                <i class="bi bi-eye" id="password-icon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">记住我</label>
                        </div>
                        <a href="#" class="text-decoration-none">忘记密码？</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginBtn">
                        <span class="spinner me-2 d-none" id="loginSpinner"></span>
                        登录
                    </button>
                </form>
                
                <div class="divider">或</div>
                
                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <a href="#" class="social-login-btn">
                            <i class="bi bi-wechat text-success"></i>
                            <span>微信登录</span>
                        </a>
                    </div>
                    <div class="col-6">
                        <a href="#" class="social-login-btn">
                            <i class="bi bi-qq text-primary"></i>
                            <span>QQ登录</span>
                        </a>
                    </div>
                </div>
                
                <div class="text-center">
                    <p class="mb-0">还没有账号？
                        <a href="/register" class="text-primary fw-bold text-decoration-none">立即注册</a>
                    </p>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a href="/home" class="text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>返回首页
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 切换密码可见性
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(inputId + '-icon');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
    
    // 登录表单提交
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const loginBtn = document.getElementById('loginBtn');
        const loginSpinner = document.getElementById('loginSpinner');
        
        // 显示加载状态
        loginBtn.disabled = true;
        loginSpinner.classList.remove('d-none');
        
        try {
            // 使用FormData方式提交
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            
            const response = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || '登录失败');
            }
            
            const data = await response.json();
            
            // 保存token
            setToken(data.access_token);
            
            showMessage('登录成功！', 'success');
            
            // 延迟跳转，让用户看到消息
            setTimeout(() => {
                window.location.href = '/home';
            }, 1000);
            
        } catch (error) {
            console.error('登录错误:', error);
            showMessage(error.message || '登录失败，请检查用户名和密码', 'error');
        } finally {
            loginBtn.disabled = false;
            loginSpinner.classList.add('d-none');
        }
    });
</script>
{% endblock %}
