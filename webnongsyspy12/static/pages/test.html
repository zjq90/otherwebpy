<div id="testPage">
    <div class="page-header">
        <h2><i class="fa fa-flask text-warning mr-2"></i>功能测试</h2>
        <p class="text-muted">用于测试系统各功能模块，生成测试数据</p>
    </div>

    <!-- 测试区域 -->
    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fa fa-database mr-2"></i>测试数据生成</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">一键生成完整的测试数据，用于演示系统功能。</p>
                    
                    <div class="form-group">
                        <label>设备数量</label>
                        <input type="number" class="form-control" id="testDeviceCount" value="3" min="1" max="10">
                    </div>
                    <div class="form-group">
                        <label>作物数量</label>
                        <input type="number" class="form-control" id="testCropCount" value="5" min="1" max="20">
                    </div>
                    <div class="form-group">
                        <label>环境数据记录数（每设备）</label>
                        <input type="number" class="form-control" id="testEnvDataCount" value="50" min="10" max="500">
                    </div>
                    <div class="form-group">
                        <label>生长记录数</label>
                        <input type="number" class="form-control" id="testGrowthCount" value="10" min="5" max="50">
                    </div>
                    
                    <button class="btn btn-primary btn-block" onclick="generateTestData()">
                        <i class="fa fa-magic mr-2"></i>生成测试数据
                    </button>
                    
                    <div class="mt-3" id="testResult"></div>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="fa fa-check-circle mr-2"></i>功能测试</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">测试各API接口是否正常工作。</p>
                    
                    <div class="list-group">
                        <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" onclick="testAPI('devices')">
                            <span><i class="fa fa-microchip text-primary mr-2"></i>设备管理API</span>
                            <span id="testDevicesStatus" class="badge badge-secondary">待测试</span>
                        </button>
                        <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" onclick="testAPI('environment')">
                            <span><i class="fa fa-bar-chart text-info mr-2"></i>环境数据API</span>
                            <span id="testEnvironmentStatus" class="badge badge-secondary">待测试</span>
                        </button>
                        <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" onclick="testAPI('crops')">
                            <span><i class="fa fa-seedling text-success mr-2"></i>作物管理API</span>
                            <span id="testCropsStatus" class="badge badge-secondary">待测试</span>
                        </button>
                        <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" onclick="testAPI('growth')">
                            <span><i class="fa fa-camera text-warning mr-2"></i>生长记录API</span>
                            <span id="testGrowthStatus" class="badge badge-secondary">待测试</span>
                        </button>
                    </div>
                    
                    <div class="mt-4">
                        <button class="btn btn-info btn-block" onclick="runAllTests()">
                            <i class="fa fa-play mr-2"></i>运行所有测试
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fa fa-trash mr-2"></i>数据清理</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">警告：此操作将删除所有数据，请谨慎使用！</p>
                    
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="confirmDelete">
                        <label class="form-check-label" for="confirmDelete">我确认要删除所有数据</label>
                    </div>
                    
                    <button class="btn btn-danger btn-block" onclick="clearAllData()" id="clearDataBtn" disabled>
                        <i class="fa fa-warning mr-2"></i>清空所有数据
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 测试日志 -->
    <div class="card mt-4">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="fa fa-terminal mr-2"></i>测试日志</h5>
            <button class="btn btn-sm btn-outline-light" onclick="clearTestLog()">清空日志</button>
        </div>
        <div class="card-body" style="background-color: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', monospace; max-height: 400px; overflow-y: auto;" id="testLog">
            <div class="text-info">[系统] 测试页面已加载，等待操作...</div>
        </div>
    </div>
</div>

<script>
// 确认删除复选框
$('#confirmDelete').change(function() {
    $('#clearDataBtn').prop('disabled', !$(this).is(':checked'));
});

// 添加日志
function addTestLog(message, type = 'info') {
    const now = new Date().toLocaleTimeString();
    const colors = {
        info: 'text-info',
        success: 'text-success',
        warning: 'text-warning',
        error: 'text-danger'
    };
    const icons = {
        info: 'fa-info-circle',
        success: 'fa-check-circle',
        warning: 'fa-exclamation-triangle',
        error: 'fa-times-circle'
    };
    
    const logHtml = `<div class="${colors[type]}"><i class="fa ${icons[type]} mr-2"></i>[${now}] ${message}</div>`;
    $('#testLog').append(logHtml);
    
    // 自动滚动到底部
    const logContainer = $('#testLog')[0];
    logContainer.scrollTop = logContainer.scrollHeight;
}

// 清空日志
function clearTestLog() {
    $('#testLog').html('<div class="text-info">[系统] 日志已清空</div>');
}

// 生成测试数据
function generateTestData() {
    const deviceCount = parseInt($('#testDeviceCount').val());
    const cropCount = parseInt($('#testCropCount').val());
    const envDataCount = parseInt($('#testEnvDataCount').val());
    const growthCount = parseInt($('#testGrowthCount').val());
    
    addTestLog('开始生成测试数据...', 'info');
    addTestLog(`配置: 设备${deviceCount}台, 作物${cropCount}个, 环境数据${envDataCount}条/设备, 生长记录${growthCount}条`, 'info');
    
    // 调用后端生成测试数据的API
    $.ajax({
        url: `${API_BASE}/test/generate-data`,
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            device_count: deviceCount,
            crop_count: cropCount,
            env_data_count: envDataCount,
            growth_count: growthCount
        }),
        success: function(res) {
            if (res.success) {
                addTestLog('测试数据生成成功！', 'success');
                addTestLog(`创建了 ${res.data.devices} 台设备`, 'success');
                addTestLog(`创建了 ${res.data.crops} 个作物`, 'success');
                addTestLog(`创建了 ${res.data.environment_data} 条环境数据`, 'success');
                addTestLog(`创建了 ${res.data.growth_records} 条生长记录`, 'success');
                
                $('#testResult').html(`
                    <div class="alert alert-success">
                        <i class="fa fa-check-circle mr-2"></i>
                        测试数据生成成功！请前往各功能页面查看数据。
                    </div>
                `);
            }
        },
        error: function(xhr) {
            const err = JSON.parse(xhr.responseText);
            addTestLog(`生成失败: ${err.detail || '未知错误'}`, 'error');
            
            $('#testResult').html(`
                <div class="alert alert-danger">
                    <i class="fa fa-times-circle mr-2"></i>
                    测试数据生成失败，请检查后端服务。
                </div>
            `);
        }
    });
}

// 测试单个API
async function testAPI(type) {
    const statusMap = {
        devices: 'testDevicesStatus',
        environment: 'testEnvironmentStatus',
        crops: 'testCropsStatus',
        growth: 'testGrowthStatus'
    };
    const nameMap = {
        devices: '设备管理',
        environment: '环境数据',
        crops: '作物管理',
        growth: '生长记录'
    };
    
    const statusEl = $(`#${statusMap[type]}`);
    statusEl.removeClass('badge-secondary badge-success badge-danger').addClass('badge-warning').text('测试中...');
    
    addTestLog(`开始测试 ${nameMap[type]} API...`, 'info');
    
    try {
        // 测试列表接口
        const listRes = await $.getJSON(`${API_BASE}/${type === 'growth' ? 'growth-records' : type}`);
        
        if (listRes.success) {
            addTestLog(`${nameMap[type]} 列表接口正常，共 ${listRes.total} 条记录`, 'success');
            
            // 测试单个获取接口（如果有数据）
            if (listRes.data.length > 0) {
                const firstId = listRes.data[0].id;
                try {
                    const detailRes = await $.getJSON(`${API_BASE}/${type === 'growth' ? 'growth-records' : type}/${firstId}`);
                    if (detailRes.success) {
                        addTestLog(`${nameMap[type]} 详情接口正常`, 'success');
                    }
                } catch (e) {
                    // 忽略详情测试失败
                }
            }
            
            statusEl.removeClass('badge-warning').addClass('badge-success').text('正常');
            addTestLog(`${nameMap[type]} API 测试通过！`, 'success');
        } else {
            throw new Error('接口返回失败');
        }
    } catch (err) {
        addTestLog(`${nameMap[type]} API 测试失败: ${err.message}`, 'error');
        statusEl.removeClass('badge-warning').addClass('badge-danger').text('失败');
    }
}

// 运行所有测试
async function runAllTests() {
    addTestLog('开始运行所有测试...', 'info');
    
    await testAPI('devices');
    await testAPI('environment');
    await testAPI('crops');
    await testAPI('growth');
    
    addTestLog('所有测试完成！', 'info');
}

// 清空所有数据
function clearAllData() {
    if (!confirm('确定要清空所有数据吗？此操作不可恢复！')) {
        return;
    }
    
    addTestLog('开始清空所有数据...', 'warning');
    
    $.ajax({
        url: `${API_BASE}/test/clear-all`,
        type: 'POST',
        success: function(res) {
            if (res.success) {
                addTestLog('数据清空成功！', 'success');
                
                // 重置所有测试状态
                $('[id^="test"][id$="Status"]').removeClass('badge-success badge-danger')
                    .addClass('badge-secondary').text('待测试');
            }
        },
        error: function(xhr) {
            const err = JSON.parse(xhr.responseText);
            addTestLog(`清空失败: ${err.detail || '未知错误'}`, 'error');
        }
    });
}

// 页面初始化
addTestLog('测试页面已就绪，可以开始生成测试数据或运行API测试。', 'info');
</script>
