<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘客管理 - 车票监控系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .sidebar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            padding-top: 20px;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 10px;
            transition: all 0.3s ease;
        }
        
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
        }
        
        .main-content {
            padding: 20px;
        }
        
        .page-header {
            margin-bottom: 30px;
        }
        
        .page-header h2 {
            color: #333;
            font-weight: 600;
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
        }
        
        .passenger-card {
            transition: all 0.3s ease;
            border-left: 4px solid #6c757d;
        }
        
        .passenger-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }
        
        .passenger-card.default {
            border-left: 4px solid var(--primary-color);
        }
        
        .modal-content {
            border-radius: 15px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border: none;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-2 sidebar">
                <div class="text-center text-white mb-4 px-3">
                    <i class="bi bi-train-front-fill display-4"></i>
                    <h5 class="mt-2">车票监控系统</h5>
                </div>
                
                <nav class="nav flex-column">
                    <a class="nav-link" href="/dashboard">
                        <i class="bi bi-speedometer2"></i>仪表盘
                    </a>
                    <a class="nav-link active" href="/passengers">
                        <i class="bi bi-people-fill"></i>乘客管理
                    </a>
                    <a class="nav-link" href="/monitor">
                        <i class="bi bi-eye-fill"></i>监控任务
                    </a>
                    <a class="nav-link" href="/orders">
                        <i class="bi bi-receipt-cutoff"></i>订单管理
                    </a>
                    <a class="nav-link" href="/alerts">
                        <i class="bi bi-bell-fill"></i>提醒中心
                    </a>
                </nav>
                
                <div class="position-absolute bottom-0 w-100 pb-4 px-3">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2" style="font-size: 24px;"></i>
                            <span id="userName">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 主内容区 -->
            <div class="col-md-10 main-content">
                <!-- 页面头部 -->
                <div class="page-header d-flex justify-content-between align-items-center">
                    <div>
                        <h2>乘客管理</h2>
                        <p class="text-muted mb-0">管理您的抢单人信息</p>
                    </div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPassengerModal">
                        <i class="bi bi-plus-lg me-2"></i>添加乘客
                    </button>
                </div>
                
                <!-- 乘客列表 -->
                <div id="passengerList">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加乘客模态框 -->
    <div class="modal fade" id="addPassengerModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>添加乘客</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addPassengerForm">
                        <div class="mb-3">
                            <label class="form-label">姓名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="passengerName" required placeholder="请输入乘客姓名">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">身份证号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="passengerIdCard" required placeholder="请输入18位身份证号" maxlength="18">
                            <div class="form-text text-muted">用于购票时的身份验证</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">手机号</label>
                            <input type="tel" class="form-control" id="passengerPhone" placeholder="请输入手机号" maxlength="11">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">乘客类型</label>
                            <select class="form-select" id="passengerType">
                                <option value="成人">成人</option>
                                <option value="儿童">儿童</option>
                                <option value="学生">学生</option>
                                <option value="残疾军人">残疾军人</option>
                            </select>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="isDefault">
                            <label class="form-check-label" for="isDefault">
                                设为默认抢单人
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="savePassengerBtn">
                        <i class="bi bi-check-lg me-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 编辑乘客模态框 -->
    <div class="modal fade" id="editPassengerModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil me-2"></i>编辑乘客</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editPassengerForm">
                        <input type="hidden" id="editPassengerId">
                        <div class="mb-3">
                            <label class="form-label">姓名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="editPassengerName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">身份证号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="editPassengerIdCard" required maxlength="18">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">手机号</label>
                            <input type="tel" class="form-control" id="editPassengerPhone" maxlength="11">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">乘客类型</label>
                            <select class="form-select" id="editPassengerType">
                                <option value="成人">成人</option>
                                <option value="儿童">儿童</option>
                                <option value="学生">学生</option>
                                <option value="残疾军人">残疾军人</option>
                            </select>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="editIsDefault">
                            <label class="form-check-label" for="editIsDefault">
                                设为默认抢单人
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="updatePassengerBtn">
                        <i class="bi bi-check-lg me-2"></i>保存修改
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast 容器 -->
    <div class="toast-container">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-info-circle me-2"></i>
                <strong class="me-auto">提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API基础地址
        const API_BASE = '/api/v1';
        
        // 获取Token
        function getToken() {
            return localStorage.getItem('token');
        }
        
        // 检查登录状态
        function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = '/';
                return false;
            }
            return true;
        }
        
        // 显示Toast提示
        function showToast(message, type = 'info') {
            const toastEl = document.getElementById('toast');
            const toastBody = document.getElementById('toastBody');
            toastBody.textContent = message;
            
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }
        
        // 加载乘客列表
        async function loadPassengers() {
            const container = document.getElementById('passengerList');
            
            try {
                const response = await fetch(`${API_BASE}/passengers`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    displayPassengers(result.data);
                } else {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-people-fill display-1 text-muted"></i>
                            <h4 class="mt-3 text-muted">暂无乘客信息</h4>
                            <p class="text-muted">点击上方"添加乘客"按钮添加抢单人信息</p>
                        </div>
                    `;
                }
            } catch (error) {
                showToast('加载乘客列表失败');
                console.error(error);
            }
        }
        
        // 显示乘客列表
        function displayPassengers(passengers) {
            const container = document.getElementById('passengerList');
            
            const html = passengers.map(p => `
                <div class="card passenger-card mb-3 ${p.is_default ? 'default' : ''}">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <div class="avatar-circle bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px; font-size: 20px; font-weight: bold;">
                                    ${p.name.charAt(0)}
                                </div>
                                <div>
                                    <h5 class="mb-1">
                                        ${p.name}
                                        ${p.is_default ? '<span class="badge bg-primary ms-2">默认</span>' : ''}
                                    </h5>
                                    <p class="text-muted mb-0 small">
                                        <i class="bi bi-credit-card-2-front me-1"></i>${p.id_card}
                                        ${p.phone ? ` | <i class="bi bi-telephone me-1"></i>${p.phone}` : ''}
                                        | <i class="bi bi-person-badge me-1"></i>${p.passenger_type}
                                    </p>
                                </div>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-outline-primary me-2" onclick="editPassenger(${p.id})">
                                    <i class="bi bi-pencil"></i> 编辑
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deletePassenger(${p.id}, '${p.name}')">
                                    <i class="bi bi-trash"></i> 删除
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = html;
        }
        
        // 保存乘客
        async function savePassenger() {
            const name = document.getElementById('passengerName').value.trim();
            const idCard = document.getElementById('passengerIdCard').value.trim();
            const phone = document.getElementById('passengerPhone').value.trim();
            const passengerType = document.getElementById('passengerType').value;
            const isDefault = document.getElementById('isDefault').checked;
            
            if (!name || !idCard) {
                showToast('请填写必填项');
                return;
            }
            
            if (idCard.length !== 18) {
                showToast('身份证号必须为18位');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/passengers`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({
                        name: name,
                        id_card: idCard,
                        phone: phone || null,
                        passenger_type: passengerType,
                        is_default: isDefault
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('乘客添加成功', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('addPassengerModal')).hide();
                    document.getElementById('addPassengerForm').reset();
                    loadPassengers();
                } else {
                    showToast(result.message || '添加失败');
                }
            } catch (error) {
                showToast('网络错误');
                console.error(error);
            }
        }
        
        // 编辑乘客
        async function editPassenger(id) {
            try {
                const response = await fetch(`${API_BASE}/passengers`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success) {
                    const passenger = result.data.find(p => p.id === id);
                    if (passenger) {
                        document.getElementById('editPassengerId').value = passenger.id;
                        document.getElementById('editPassengerName').value = passenger.name;
                        document.getElementById('editPassengerIdCard').value = passenger.id_card.replace(/\*/g, '');
                        document.getElementById('editPassengerPhone').value = passenger.phone || '';
                        document.getElementById('editPassengerType').value = passenger.passenger_type;
                        document.getElementById('editIsDefault').checked = passenger.is_default;
                        
                        new bootstrap.Modal(document.getElementById('editPassengerModal')).show();
                    }
                }
            } catch (error) {
                showToast('获取乘客信息失败');
            }
        }
        
        // 更新乘客
        async function updatePassenger() {
            const id = parseInt(document.getElementById('editPassengerId').value);
            const name = document.getElementById('editPassengerName').value.trim();
            const idCard = document.getElementById('editPassengerIdCard').value.trim();
            const phone = document.getElementById('editPassengerPhone').value.trim();
            const passengerType = document.getElementById('editPassengerType').value;
            const isDefault = document.getElementById('editIsDefault').checked;
            
            if (!name || !idCard) {
                showToast('请填写必填项');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/passengers/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({
                        name: name,
                        id_card: idCard,
                        phone: phone || null,
                        passenger_type: passengerType,
                        is_default: isDefault
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('乘客信息更新成功', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('editPassengerModal')).hide();
                    loadPassengers();
                } else {
                    showToast(result.message || '更新失败');
                }
            } catch (error) {
                showToast('网络错误');
            }
        }
        
        // 删除乘客
        async function deletePassenger(id, name) {
            if (!confirm(`确定要删除乘客"${name}"吗？`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/passengers/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('乘客删除成功', 'success');
                    loadPassengers();
                } else {
                    showToast(result.message || '删除失败');
                }
            } catch (error) {
                showToast('网络错误');
            }
        }
        
        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuth()) return;
            
            // 显示用户名
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('userName').textContent = user.username || '用户';
            
            // 退出登录事件
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                logout();
            });
            
            // 保存乘客按钮
            document.getElementById('savePassengerBtn').addEventListener('click', savePassenger);
            
            // 更新乘客按钮
            document.getElementById('updatePassengerBtn').addEventListener('click', updatePassenger);
            
            // 加载乘客列表
            loadPassengers();
        });
    </script>
</body>
</html>
