<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - 车票监控系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .sidebar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            padding-top: 20px;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 10px;
            transition: all 0.3s ease;
        }
        
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
        }
        
        .main-content {
            padding: 20px;
        }
        
        .stat-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .stat-icon-blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .stat-icon-green { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: white; }
        .stat-icon-orange { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white; }
        .stat-icon-purple { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333; }
        
        .page-header {
            margin-bottom: 30px;
        }
        
        .page-header h2 {
            color: #333;
            font-weight: 600;
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-2 sidebar">
                <div class="text-center text-white mb-4 px-3">
                    <i class="bi bi-train-front-fill display-4"></i>
                    <h5 class="mt-2">车票监控系统</h5>
                </div>
                
                <nav class="nav flex-column">
                    <a class="nav-link active" href="/dashboard">
                        <i class="bi bi-speedometer2"></i>仪表盘
                    </a>
                    <a class="nav-link" href="/passengers">
                        <i class="bi bi-people-fill"></i>乘客管理
                    </a>
                    <a class="nav-link" href="/monitor">
                        <i class="bi bi-eye-fill"></i>监控任务
                    </a>
                    <a class="nav-link" href="/orders">
                        <i class="bi bi-receipt-cutoff"></i>订单管理
                    </a>
                    <a class="nav-link" href="/alerts">
                        <i class="bi bi-bell-fill"></i>提醒中心
                    </a>
                </nav>
                
                <div class="position-absolute bottom-0 w-100 pb-4 px-3">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2" style="font-size: 24px;"></i>
                            <span id="userName">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 主内容区 -->
            <div class="col-md-10 main-content">
                <!-- 页面头部 -->
                <div class="page-header d-flex justify-content-between align-items-center">
                    <div>
                        <h2>仪表盘</h2>
                        <p class="text-muted mb-0">欢迎使用车票监控系统</p>
                    </div>
                    <div>
                        <span class="text-muted small" id="currentTime"></span>
                    </div>
                </div>
                
                <!-- 统计卡片 -->
                <div class="row mb-4">
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="stat-icon stat-icon-blue">
                                        <i class="bi bi-eye-fill"></i>
                                    </div>
                                    <div class="ms-3">
                                        <h3 class="mb-0" id="taskCount">0</h3>
                                        <small class="text-muted">监控任务</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="stat-icon stat-icon-green">
                                        <i class="bi bi-play-circle-fill"></i>
                                    </div>
                                    <div class="ms-3">
                                        <h3 class="mb-0" id="runningTaskCount">0</h3>
                                        <small class="text-muted">运行中</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="stat-icon stat-icon-orange">
                                        <i class="bi bi-receipt-cutoff"></i>
                                    </div>
                                    <div class="ms-3">
                                        <h3 class="mb-0" id="orderCount">0</h3>
                                        <small class="text-muted">订单总数</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="stat-icon stat-icon-purple">
                                        <i class="bi bi-bell-fill"></i>
                                    </div>
                                    <div class="ms-3">
                                        <h3 class="mb-0" id="unreadAlertCount">0</h3>
                                        <small class="text-muted">未读提醒</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 快捷操作 -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header bg-white">
                                <h6 class="mb-0"><i class="bi bi-lightning-charge me-2"></i>快捷操作</h6>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-3 mb-2">
                                        <a href="/passengers" class="btn btn-outline-primary w-100">
                                            <i class="bi bi-person-plus me-2"></i>添加乘客
                                        </a>
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <a href="/monitor" class="btn btn-outline-success w-100">
                                            <i class="bi bi-plus-circle me-2"></i>创建监控
                                        </a>
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <a href="/orders" class="btn btn-outline-warning w-100">
                                            <i class="bi bi-cart-check me-2"></i>查看订单
                                        </a>
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <a href="/alerts" class="btn btn-outline-info w-100">
                                            <i class="bi bi-bell me-2"></i>查看提醒
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 监控任务列表 -->
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                                <h6 class="mb-0"><i class="bi bi-list-check me-2"></i>最近监控任务</h6>
                                <a href="/monitor" class="btn btn-sm btn-outline-primary">查看全部</a>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                            <tr>
                                                <th>任务名称</th>
                                                <th>路线</th>
                                                <th>日期</th>
                                                <th>状态</th>
                                                <th>是否发现票</th>
                                                <th>操作</th>
                                            </tr>
                                        </thead>
                                        <tbody id="recentTasks">
                                            <tr>
                                                <td colspan="6" class="text-center text-muted">加载中...</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast 容器 -->
    <div class="toast-container">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-info-circle me-2"></i>
                <strong class="me-auto">提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API基础地址
        const API_BASE = '/api/v1';
        
        // 获取Token
        function getToken() {
            return localStorage.getItem('token');
        }
        
        // 检查登录状态
        function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = '/';
                return false;
            }
            return true;
        }
        
        // 显示Toast提示
        function showToast(message, type = 'info') {
            const toastEl = document.getElementById('toast');
            const toastBody = document.getElementById('toastBody');
            toastBody.textContent = message;
            
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }
        
        // 获取状态徽章
        function getStatusBadge(status) {
            const statusMap = {
                'running': '<span class="badge bg-success">运行中</span>',
                'stopped': '<span class="badge bg-secondary">已停止</span>',
                'completed': '<span class="badge bg-info">已完成</span>',
                'failed': '<span class="badge bg-danger">失败</span>'
            };
            return statusMap[status] || '<span class="badge bg-secondary">未知</span>';
        }
        
        // 加载统计数据
        async function loadStats() {
            try {
                // 加载监控任务
                const taskResponse = await fetch(`${API_BASE}/monitor-tasks`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const taskResult = await taskResponse.json();
                
                if (taskResult.success) {
                    const tasks = taskResult.data;
                    document.getElementById('taskCount').textContent = tasks.length;
                    const runningCount = tasks.filter(t => t.status === 'running').length;
                    document.getElementById('runningTaskCount').textContent = runningCount;
                    
                    // 显示最近任务
                    displayRecentTasks(tasks.slice(0, 5));
                }
                
                // 加载订单
                const orderResponse = await fetch(`${API_BASE}/orders`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const orderResult = await orderResponse.json();
                
                if (orderResult.success) {
                    document.getElementById('orderCount').textContent = orderResult.data.length;
                }
                
                // 加载未读提醒
                const alertResponse = await fetch(`${API_BASE}/alerts?unread_only=true`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const alertResult = await alertResponse.json();
                
                if (alertResult.success) {
                    document.getElementById('unreadAlertCount').textContent = alertResult.data.length;
                }
            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        }
        
        // 显示最近任务
        function displayRecentTasks(tasks) {
            const tbody = document.getElementById('recentTasks');
            
            if (tasks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">暂无监控任务</td></tr>';
                return;
            }
            
            tbody.innerHTML = tasks.map(task => `
                <tr>
                    <td>${task.task_name}</td>
                    <td>${task.from_station} → ${task.to_station}</td>
                    <td>${task.train_date}</td>
                    <td>${getStatusBadge(task.status)}</td>
                    <td>${task.ticket_found ? '<i class="bi bi-check-circle-fill text-success"></i>' : '<i class="bi bi-x-circle text-muted"></i>'}</td>
                    <td>
                        ${task.status === 'stopped' ? 
                            `<button class="btn btn-sm btn-outline-success" onclick="startTask(${task.id})">启动</button>` :
                            `<button class="btn btn-sm btn-outline-warning" onclick="stopTask(${task.id})">停止</button>`
                        }
                    </td>
                </tr>
            `).join('');
        }
        
        // 启动任务
        async function startTask(taskId) {
            try {
                const response = await fetch(`${API_BASE}/monitor-tasks/${taskId}/start`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success) {
                    showToast('任务已启动', 'success');
                    loadStats();
                } else {
                    showToast(result.message || '启动失败');
                }
            } catch (error) {
                showToast('网络错误');
            }
        }
        
        // 停止任务
        async function stopTask(taskId) {
            try {
                const response = await fetch(`${API_BASE}/monitor-tasks/${taskId}/stop`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success) {
                    showToast('任务已停止', 'success');
                    loadStats();
                } else {
                    showToast(result.message || '停止失败');
                }
            } catch (error) {
                showToast('网络错误');
            }
        }
        
        // 更新时间
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN');
        }
        
        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuth()) return;
            
            // 显示用户名
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('userName').textContent = user.username || '用户';
            
            // 退出登录事件
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                logout();
            });
            
            // 加载数据
            loadStats();
            
            // 更新时间
            updateTime();
            setInterval(updateTime, 1000);
        });
    </script>
</body>
</html>
