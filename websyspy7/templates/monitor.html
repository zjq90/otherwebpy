<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>监控任务 - 车票监控系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .sidebar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            padding-top: 20px;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 10px;
            transition: all 0.3s ease;
        }
        
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
        }
        
        .main-content {
            padding: 20px;
        }
        
        .page-header {
            margin-bottom: 30px;
        }
        
        .page-header h2 {
            color: #333;
            font-weight: 600;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
        }
        
        .task-card {
            transition: all 0.3s ease;
        }
        
        .task-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }
        
        .task-card.running {
            border-left: 4px solid #198754;
        }
        
        .task-card.stopped {
            border-left: 4px solid #6c757d;
        }
        
        .modal-content {
            border-radius: 15px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border: none;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        
        .badge-running {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-2 sidebar">
                <div class="text-center text-white mb-4 px-3">
                    <i class="bi bi-train-front-fill display-4"></i>
                    <h5 class="mt-2">车票监控系统</h5>
                </div>
                
                <nav class="nav flex-column">
                    <a class="nav-link" href="/dashboard">
                        <i class="bi bi-speedometer2"></i>仪表盘
                    </a>
                    <a class="nav-link" href="/passengers">
                        <i class="bi bi-people-fill"></i>乘客管理
                    </a>
                    <a class="nav-link active" href="/monitor">
                        <i class="bi bi-eye-fill"></i>监控任务
                    </a>
                    <a class="nav-link" href="/orders">
                        <i class="bi bi-receipt-cutoff"></i>订单管理
                    </a>
                    <a class="nav-link" href="/alerts">
                        <i class="bi bi-bell-fill"></i>提醒中心
                    </a>
                </nav>
                
                <div class="position-absolute bottom-0 w-100 pb-4 px-3">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2" style="font-size: 24px;"></i>
                            <span id="userName">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 主内容区 -->
            <div class="col-md-10 main-content">
                <!-- 页面头部 -->
                <div class="page-header d-flex justify-content-between align-items-center">
                    <div>
                        <h2>监控任务</h2>
                        <p class="text-muted mb-0">创建和管理您的余票监控任务</p>
                    </div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                        <i class="bi bi-plus-lg me-2"></i>新建任务
                    </button>
                </div>
                
                <!-- 任务列表 -->
                <div id="taskList">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 新建任务模态框 -->
    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>新建监控任务</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addTaskForm">
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label class="form-label">任务名称 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="taskName" required placeholder="例如：北京到上海G字头监控">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">出发站 <span class="text-danger">*</span></label>
                                <select class="form-select" id="fromStation" required>
                                    <option value="">请选择出发站</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">到达站 <span class="text-danger">*</span></label>
                                <select class="form-select" id="toStation" required>
                                    <option value="">请选择到达站</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">出发日期 <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="trainDate" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">指定车次（可选）</label>
                                <input type="text" class="form-control" id="trainNumbers" placeholder="例如：G1,G5，多个用逗号分隔">
                                <div class="form-text">留空则监控所有车次</div>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">席别选择</label>
                                <div class="row">
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="seatSwz" value="商务座">
                                            <label class="form-check-label" for="seatSwz">商务座</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="seatZy" value="一等座">
                                            <label class="form-check-label" for="seatZy">一等座</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="seatZe" value="二等座" checked>
                                            <label class="form-check-label" for="seatZe">二等座</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="seatYw" value="硬卧">
                                            <label class="form-check-label" for="seatYw">硬卧</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">监控乘客</label>
                                <select class="form-select" id="passengerSelect" multiple>
                                    <option value="">请先添加乘客</option>
                                </select>
                                <div class="form-text">按住Ctrl可多选，用于自动下单</div>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">轮询间隔（秒）</label>
                                <input type="number" class="form-control" id="pollInterval" value="1" min="0.5" max="60" step="0.1">
                                <div class="form-text">建议1-5秒，过短可能触发限制</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">自动下单</label>
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" id="autoSubmit">
                                    <label class="form-check-label" for="autoSubmit">
                                        监控到有票时自动提交订单
                                    </label>
                                </div>
                                <div class="form-text text-warning">
                                    <i class="bi bi-exclamation-triangle"></i> 请确保已配置正确的乘客信息
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveTaskBtn">
                        <i class="bi bi-check-lg me-2"></i>创建任务
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast 容器 -->
    <div class="toast-container">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-info-circle me-2"></i>
                <strong class="me-auto">提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API基础地址
        const API_BASE = '/api/v1';
        
        // 获取Token
        function getToken() {
            return localStorage.getItem('token');
        }
        
        // 检查登录状态
        function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = '/';
                return false;
            }
            return true;
        }
        
        // 显示Toast提示
        function showToast(message, type = 'info') {
            const toastEl = document.getElementById('toast');
            const toastBody = document.getElementById('toastBody');
            toastBody.textContent = message;
            
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }
        
        // 获取状态徽章
        function getStatusBadge(status) {
            const statusMap = {
                'running': '<span class="badge bg-success badge-running">运行中</span>',
                'stopped': '<span class="badge bg-secondary">已停止</span>',
                'completed': '<span class="badge bg-info">已完成</span>',
                'failed': '<span class="badge bg-danger">失败</span>'
            };
            return statusMap[status] || '<span class="badge bg-secondary">未知</span>';
        }
        
        // 加载站点列表
        async function loadStations() {
            try {
                const response = await fetch(`${API_BASE}/test/stations`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success) {
                    const stations = result.data;
                    const fromSelect = document.getElementById('fromStation');
                    const toSelect = document.getElementById('toStation');
                    
                    const options = stations.map(s => `<option value="${s.name}">${s.name} (${s.code})</option>`).join('');
                    
                    fromSelect.innerHTML = '<option value="">请选择出发站</option>' + options;
                    toSelect.innerHTML = '<option value="">请选择到达站</option>' + options;
                }
            } catch (error) {
                console.error('加载站点失败:', error);
            }
        }
        
        // 加载乘客列表
        async function loadPassengers() {
            try {
                const response = await fetch(`${API_BASE}/passengers`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success) {
                    const passengers = result.data;
                    const select = document.getElementById('passengerSelect');
                    
                    if (passengers.length === 0) {
                        select.innerHTML = '<option value="">请先添加乘客</option>';
                    } else {
                        select.innerHTML = passengers.map(p => 
                            `<option value="${p.id}">${p.name} (${p.passenger_type})</option>`
                        ).join('');
                    }
                }
            } catch (error) {
                console.error('加载乘客失败:', error);
            }
        }
        
        // 加载任务列表
        async function loadTasks() {
            const container = document.getElementById('taskList');
            
            try {
                const response = await fetch(`${API_BASE}/monitor-tasks`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    displayTasks(result.data);
                } else {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-eye-slash display-1 text-muted"></i>
                            <h4 class="mt-3 text-muted">暂无监控任务</h4>
                            <p class="text-muted">点击上方"新建任务"按钮创建您的第一个监控任务</p>
                        </div>
                    `;
                }
            } catch (error) {
                showToast('加载任务列表失败');
                console.error(error);
            }
        }
        
        // 显示任务列表
        function displayTasks(tasks) {
            const container = document.getElementById('taskList');
            
            const html = tasks.map(task => `
                <div class="card task-card mb-3 ${task.status}">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-4">
                                <h5 class="mb-1">
                                    ${task.task_name}
                                    ${task.ticket_found ? '<i class="bi bi-check-circle-fill text-success ms-2" title="已发现余票"></i>' : ''}
                                </h5>
                                <p class="text-muted mb-0">
                                    <i class="bi bi-train-front me-1"></i>${task.from_station} → ${task.to_station}
                                    <span class="mx-2">|</span>
                                    <i class="bi bi-calendar me-1"></i>${task.train_date}
                                </p>
                            </div>
                            <div class="col-md-2">
                                ${getStatusBadge(task.status)}
                                ${task.runtime_status ? `<div class="text-muted small mt-1">已检查: ${task.runtime_status.check_count || 0}次</div>` : ''}
                            </div>
                            <div class="col-md-2">
                                <div class="text-muted small">席别: ${task.seat_types || '全部'}</div>
                                <div class="text-muted small">间隔: ${task.poll_interval}秒</div>
                            </div>
                            <div class="col-md-2">
                                ${task.auto_submit ? '<span class="badge bg-warning"><i class="bi bi-lightning-charge me-1"></i>自动下单</span>' : '<span class="badge bg-light text-dark">手动</span>'}
                            </div>
                            <div class="col-md-2 text-end">
                                ${task.status === 'stopped' ? 
                                    `<button class="btn btn-sm btn-success me-2" onclick="startTask(${task.id})">
                                        <i class="bi bi-play-fill"></i> 启动
                                    </button>` :
                                    `<button class="btn btn-sm btn-warning me-2" onclick="stopTask(${task.id})">
                                        <i class="bi bi-pause-fill"></i> 停止
                                    </button>`
                                }
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteTask(${task.id}, '${task.task_name}')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = html;
        }
        
        // 获取选中的席别
        function getSelectedSeatTypes() {
            const seats = [];
            if (document.getElementById('seatSwz').checked) seats.push('商务座');
            if (document.getElementById('seatZy').checked) seats.push('一等座');
            if (document.getElementById('seatZe').checked) seats.push('二等座');
            if (document.getElementById('seatYw').checked) seats.push('硬卧');
            return seats.join(',');
        }
        
        // 获取选中的乘客ID
        function getSelectedPassengerIds() {
            const select = document.getElementById('passengerSelect');
            const ids = [];
            for (const option of select.options) {
                if (option.selected && option.value) {
                    ids.push(option.value);
                }
            }
            return ids.join(',');
        }
        
        // 创建任务
        async function createTask() {
            const taskName = document.getElementById('taskName').value.trim();
            const fromStation = document.getElementById('fromStation').value;
            const toStation = document.getElementById('toStation').value;
            const trainDate = document.getElementById('trainDate').value;
            const trainNumbers = document.getElementById('trainNumbers').value.trim();
            const pollInterval = parseFloat(document.getElementById('pollInterval').value);
            const autoSubmit = document.getElementById('autoSubmit').checked;
            
            if (!taskName || !fromStation || !toStation || !trainDate) {
                showToast('请填写必填项');
                return;
            }
            
            if (fromStation === toStation) {
                showToast('出发站和到达站不能相同');
                return;
            }
            
            const today = new Date().toISOString().split('T')[0];
            if (trainDate < today) {
                showToast('出发日期不能早于今天');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/monitor-tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({
                        task_name: taskName,
                        from_station: fromStation,
                        to_station: toStation,
                        train_date: trainDate,
                        train_numbers: trainNumbers || null,
                        seat_types: getSelectedSeatTypes() || null,
                        passenger_ids: getSelectedPassengerIds() || null,
                        poll_interval: pollInterval,
                        auto_submit: autoSubmit,
                        max_retries: 3
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('任务创建成功', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('addTaskModal')).hide();
                    document.getElementById('addTaskForm').reset();
                    loadTasks();
                } else {
                    showToast(result.message || '创建失败');
                }
            } catch (error) {
                showToast('网络错误');
                console.error(error);
            }
        }
        
        // 启动任务
        async function startTask(taskId) {
            try {
                const response = await fetch(`${API_BASE}/monitor-tasks/${taskId}/start`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success) {
                    showToast('任务已启动', 'success');
                    loadTasks();
                } else {
                    showToast(result.message || '启动失败');
                }
            } catch (error) {
                showToast('网络错误');
            }
        }
        
        // 停止任务
        async function stopTask(taskId) {
            try {
                const response = await fetch(`${API_BASE}/monitor-tasks/${taskId}/stop`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success) {
                    showToast('任务已停止', 'success');
                    loadTasks();
                } else {
                    showToast(result.message || '停止失败');
                }
            } catch (error) {
                showToast('网络错误');
            }
        }
        
        // 删除任务
        async function deleteTask(taskId, taskName) {
            if (!confirm(`确定要删除监控任务"${taskName}"吗？`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/monitor-tasks/${taskId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('任务删除成功', 'success');
                    loadTasks();
                } else {
                    showToast(result.message || '删除失败');
                }
            } catch (error) {
                showToast('网络错误');
            }
        }
        
        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuth()) return;
            
            // 显示用户名
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('userName').textContent = user.username || '用户';
            
            // 退出登录事件
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                logout();
            });
            
            // 设置默认日期为明天
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('trainDate').value = tomorrow.toISOString().split('T')[0];
            
            // 保存任务按钮
            document.getElementById('saveTaskBtn').addEventListener('click', createTask);
            
            // 加载数据
            loadStations();
            loadPassengers();
            loadTasks();
            
            // 定时刷新任务状态
            setInterval(loadTasks, 5000);
        });
    </script>
</body>
</html>
