<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提醒中心 - 车票监控系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .sidebar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            padding-top: 20px;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 10px;
            transition: all 0.3s ease;
        }
        
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
        }
        
        .main-content {
            padding: 20px;
        }
        
        .page-header {
            margin-bottom: 30px;
        }
        
        .page-header h2 {
            color: #333;
            font-weight: 600;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
        }
        
        .alert-item {
            transition: all 0.3s ease;
            border-left: 4px solid #6c757d;
        }
        
        .alert-item:hover {
            background-color: #f8f9fa;
        }
        
        .alert-item.unread {
            background-color: #f0f4ff;
            border-left: 4px solid var(--primary-color);
        }
        
        .alert-item.unread:hover {
            background-color: #e8eeff;
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-2 sidebar">
                <div class="text-center text-white mb-4 px-3">
                    <i class="bi bi-train-front-fill display-4"></i>
                    <h5 class="mt-2">车票监控系统</h5>
                </div>
                
                <nav class="nav flex-column">
                    <a class="nav-link" href="/dashboard">
                        <i class="bi bi-speedometer2"></i>仪表盘
                    </a>
                    <a class="nav-link" href="/passengers">
                        <i class="bi bi-people-fill"></i>乘客管理
                    </a>
                    <a class="nav-link" href="/monitor">
                        <i class="bi bi-eye-fill"></i>监控任务
                    </a>
                    <a class="nav-link" href="/orders">
                        <i class="bi bi-receipt-cutoff"></i>订单管理
                    </a>
                    <a class="nav-link active" href="/alerts">
                        <i class="bi bi-bell-fill"></i>提醒中心
                    </a>
                </nav>
                
                <div class="position-absolute bottom-0 w-100 pb-4 px-3">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2" style="font-size: 24px;"></i>
                            <span id="userName">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 主内容区 -->
            <div class="col-md-10 main-content">
                <!-- 页面头部 -->
                <div class="page-header d-flex justify-content-between align-items-center">
                    <div>
                        <h2>提醒中心</h2>
                        <p class="text-muted mb-0">查看系统发送的余票提醒和订单通知</p>
                    </div>
                    <div>
                        <button class="btn btn-outline-primary me-2" onclick="markAllRead()">
                            <i class="bi bi-check-all"></i> 全部已读
                        </button>
                    </div>
                </div>
                
                <!-- 统计卡片 -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5 class="text-primary" id="totalCount">0</h5>
                                <small class="text-muted">总提醒数</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5 class="text-warning" id="unreadCount">0</h5>
                                <small class="text-muted">未读提醒</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5 class="text-success" id="readCount">0</h5>
                                <small class="text-muted">已读提醒</small>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 筛选器 -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <label class="form-label small">阅读状态</label>
                                <select class="form-select form-select-sm" id="readFilter">
                                    <option value="">全部</option>
                                    <option value="unread">未读</option>
                                    <option value="read">已读</option>
                                </select>
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button class="btn btn-outline-primary btn-sm me-2" onclick="loadAlerts()">
                                    <i class="bi bi-search"></i> 查询
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()">
                                    <i class="bi bi-arrow-counterclockwise"></i> 重置
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 提醒列表 -->
                <div id="alertList">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast 容器 -->
    <div class="toast-container">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-info-circle me-2"></i>
                <strong class="me-auto">提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API基础地址
        const API_BASE = '/api/v1';
        
        // 获取Token
        function getToken() {
            return localStorage.getItem('token');
        }
        
        // 检查登录状态
        function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = '/';
                return false;
            }
            return true;
        }
        
        // 显示Toast提示
        function showToast(message, type = 'info') {
            const toastEl = document.getElementById('toast');
            const toastBody = document.getElementById('toastBody');
            toastBody.textContent = message;
            
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }
        
        // 获取提醒类型图标
        function getAlertIcon(type) {
            const iconMap = {
                'system': 'bi-bell-fill text-primary',
                'sms': 'bi-chat-dots-fill text-success',
                'email': 'bi-envelope-fill text-warning'
            };
            return iconMap[type] || 'bi-bell-fill text-primary';
        }
        
        // 加载提醒列表
        async function loadAlerts() {
            const container = document.getElementById('alertList');
            const unreadOnly = document.getElementById('readFilter').value === 'unread';
            
            try {
                const url = unreadOnly ? 
                    `${API_BASE}/alerts?unread_only=true` : 
                    `${API_BASE}/alerts`;
                
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success) {
                    // 更新统计
                    updateStats(result.data);
                    
                    // 显示列表
                    displayAlerts(result.data);
                }
            } catch (error) {
                showToast('加载提醒列表失败');
                console.error(error);
            }
        }
        
        // 更新统计
        function updateStats(alerts) {
            const total = alerts.length;
            const unread = alerts.filter(a => !a.is_read).length;
            const read = total - unread;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('unreadCount').textContent = unread;
            document.getElementById('readCount').textContent = read;
        }
        
        // 显示提醒列表
        function displayAlerts(alerts) {
            const container = document.getElementById('alertList');
            
            if (alerts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-bell-slash display-1 text-muted"></i>
                        <h4 class="mt-3 text-muted">暂无提醒</h4>
                        <p class="text-muted">当监控任务发现余票或订单状态变化时，系统会发送提醒</p>
                    </div>
                `;
                return;
            }
            
            const html = alerts.map(alert => `
                <div class="card alert-item mb-3 ${!alert.is_read ? 'unread' : ''}" onclick="markAsRead(${alert.id}, event)">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="d-flex">
                                <div class="me-3">
                                    <i class="bi ${getAlertIcon(alert.alert_type)}" style="font-size: 24px;"></i>
                                </div>
                                <div>
                                    <h6 class="mb-1">
                                        ${!alert.is_read ? '<span class="text-primary me-2">●</span>' : ''}
                                        ${alert.alert_title}
                                    </h6>
                                    <p class="text-muted mb-0 small" style="white-space: pre-wrap;">${alert.alert_content}</p>
                                </div>
                            </div>
                            <div class="text-end">
                                <small class="text-muted">${formatDate(alert.created_at)}</small>
                                ${!alert.is_read ? `
                                    <div class="mt-1">
                                        <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); markAsRead(${alert.id}, event)">
                                            标记已读
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = html;
        }
        
        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;
            
            // 小于1分钟
            if (diff < 60000) {
                return '刚刚';
            }
            // 小于1小时
            if (diff < 3600000) {
                return `${Math.floor(diff / 60000)}分钟前`;
            }
            // 小于1天
            if (diff < 86400000) {
                return `${Math.floor(diff / 3600000)}小时前`;
            }
            // 其他显示日期
            return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }
        
        // 标记为已读
        async function markAsRead(alertId, event) {
            event.stopPropagation();
            
            try {
                const response = await fetch(`${API_BASE}/alerts/${alertId}/read`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    loadAlerts();
                }
            } catch (error) {
                showToast('操作失败');
            }
        }
        
        // 全部标记为已读
        async function markAllRead() {
            try {
                const response = await fetch(`${API_BASE}/alerts`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success) {
                    const unreadAlerts = result.data.filter(a => !a.is_read);
                    
                    for (const alert of unreadAlerts) {
                        await fetch(`${API_BASE}/alerts/${alert.id}/read`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${getToken()}` }
                        });
                    }
                    
                    showToast('已全部标记为已读', 'success');
                    loadAlerts();
                }
            } catch (error) {
                showToast('操作失败');
            }
        }
        
        // 重置筛选器
        function resetFilters() {
            document.getElementById('readFilter').value = '';
            loadAlerts();
        }
        
        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuth()) return;
            
            // 显示用户名
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('userName').textContent = user.username || '用户';
            
            // 退出登录事件
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                logout();
            });
            
            // 加载提醒
            loadAlerts();
        });
    </script>
</body>
</html>
