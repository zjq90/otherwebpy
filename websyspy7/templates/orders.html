<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 车票监控系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .sidebar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            padding-top: 20px;
        }
        
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 10px;
            transition: all 0.3s ease;
        }
        
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
        }
        
        .main-content {
            padding: 20px;
        }
        
        .page-header {
            margin-bottom: 30px;
        }
        
        .page-header h2 {
            color: #333;
            font-weight: 600;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
        }
        
        .order-card {
            transition: all 0.3s ease;
        }
        
        .order-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-2 sidebar">
                <div class="text-center text-white mb-4 px-3">
                    <i class="bi bi-train-front-fill display-4"></i>
                    <h5 class="mt-2">车票监控系统</h5>
                </div>
                
                <nav class="nav flex-column">
                    <a class="nav-link" href="/dashboard">
                        <i class="bi bi-speedometer2"></i>仪表盘
                    </a>
                    <a class="nav-link" href="/passengers">
                        <i class="bi bi-people-fill"></i>乘客管理
                    </a>
                    <a class="nav-link" href="/monitor">
                        <i class="bi bi-eye-fill"></i>监控任务
                    </a>
                    <a class="nav-link active" href="/orders">
                        <i class="bi bi-receipt-cutoff"></i>订单管理
                    </a>
                    <a class="nav-link" href="/alerts">
                        <i class="bi bi-bell-fill"></i>提醒中心
                    </a>
                </nav>
                
                <div class="position-absolute bottom-0 w-100 pb-4 px-3">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-2" style="font-size: 24px;"></i>
                            <span id="userName">用户</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- 主内容区 -->
            <div class="col-md-10 main-content">
                <!-- 页面头部 -->
                <div class="page-header d-flex justify-content-between align-items-center">
                    <div>
                        <h2>订单管理</h2>
                        <p class="text-muted mb-0">查看和管理您的车票订单</p>
                    </div>
                </div>
                
                <!-- 筛选器 -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <label class="form-label small">订单状态</label>
                                <select class="form-select form-select-sm" id="statusFilter">
                                    <option value="">全部状态</option>
                                    <option value="pending">待提交</option>
                                    <option value="submitted">已提交</option>
                                    <option value="paid">已支付</option>
                                    <option value="cancelled">已取消</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small">乘车日期</label>
                                <input type="date" class="form-control form-control-sm" id="dateFilter">
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button class="btn btn-outline-primary btn-sm me-2" onclick="loadOrders()">
                                    <i class="bi bi-search"></i> 查询
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()">
                                    <i class="bi bi-arrow-counterclockwise"></i> 重置
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 订单列表 -->
                <div id="orderList">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast 容器 -->
    <div class="toast-container">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-info-circle me-2"></i>
                <strong class="me-auto">提示</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API基础地址
        const API_BASE = '/api/v1';
        
        // 获取Token
        function getToken() {
            return localStorage.getItem('token');
        }
        
        // 检查登录状态
        function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = '/';
                return false;
            }
            return true;
        }
        
        // 显示Toast提示
        function showToast(message, type = 'info') {
            const toastEl = document.getElementById('toast');
            const toastBody = document.getElementById('toastBody');
            toastBody.textContent = message;
            
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }
        
        // 获取状态徽章
        function getStatusBadge(status) {
            const statusMap = {
                'pending': '<span class="badge bg-secondary">待提交</span>',
                'submitted': '<span class="badge bg-warning">已提交</span>',
                'paid': '<span class="badge bg-success">已支付</span>',
                'cancelled': '<span class="badge bg-danger">已取消</span>',
                'failed': '<span class="badge bg-secondary">失败</span>'
            };
            return statusMap[status] || '<span class="badge bg-secondary">未知</span>';
        }
        
        // 加载订单列表
        async function loadOrders() {
            const container = document.getElementById('orderList');
            
            try {
                const response = await fetch(`${API_BASE}/orders`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                const result = await response.json();
                
                if (result.success && result.data.length > 0) {
                    // 应用筛选器
                    let orders = result.data;
                    
                    const statusFilter = document.getElementById('statusFilter').value;
                    const dateFilter = document.getElementById('dateFilter').value;
                    
                    if (statusFilter) {
                        orders = orders.filter(o => o.status === statusFilter);
                    }
                    
                    if (dateFilter) {
                        orders = orders.filter(o => o.train_date === dateFilter);
                    }
                    
                    displayOrders(orders);
                } else {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-receipt-cutoff display-1 text-muted"></i>
                            <h4 class="mt-3 text-muted">暂无订单</h4>
                            <p class="text-muted">当监控任务发现余票并自动下单后，订单将显示在这里</p>
                        </div>
                    `;
                }
            } catch (error) {
                showToast('加载订单列表失败');
                console.error(error);
            }
        }
        
        // 显示订单列表
        function displayOrders(orders) {
            const container = document.getElementById('orderList');
            
            const html = orders.map(order => `
                <div class="card order-card mb-3">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <div>
                            <i class="bi bi-receipt-cutoff text-primary me-2"></i>
                            <strong>订单号: ${order.order_no || '未生成'}</strong>
                            <span class="ms-3">${getStatusBadge(order.status)}</span>
                        </div>
                        <small class="text-muted">
                            <i class="bi bi-clock me-1"></i>${order.created_at ? new Date(order.created_at).toLocaleString('zh-CN') : ''}
                        </small>
                    </div>
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <div class="d-flex align-items-center">
                                    <div class="text-center">
                                        <h5 class="mb-0">${order.from_station}</h5>
                                        <small class="text-muted">${order.depart_time || '--:--'}</small>
                                    </div>
                                    <div class="mx-3 text-primary">
                                        <i class="bi bi-arrow-right"></i>
                                    </div>
                                    <div class="text-center">
                                        <h5 class="mb-0">${order.to_station}</h5>
                                        <small class="text-muted">${order.arrive_time || '--:--'}</small>
                                    </div>
                                </div>
                                <div class="mt-2">
                                    <span class="badge bg-primary me-2">${order.train_number}</span>
                                    <span class="text-muted">${order.train_date}</span>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="text-muted small">席别</div>
                                <strong>${order.seat_type}</strong>
                            </div>
                            <div class="col-md-2">
                                <div class="text-muted small">座位号</div>
                                <strong>${order.seat_no || '待分配'}</strong>
                            </div>
                            <div class="col-md-2">
                                <div class="text-muted small">金额</div>
                                <strong class="text-danger">¥${order.total_amount || '0.00'}</strong>
                            </div>
                            <div class="col-md-3 text-end">
                                ${order.status === 'submitted' ? `
                                    <button class="btn btn-sm btn-outline-danger me-2" onclick="cancelOrder(${order.id})">
                                        <i class="bi bi-x-circle"></i> 取消订单
                                    </button>
                                ` : ''}
                                ${order.status === 'submitted' ? `
                                    <button class="btn btn-sm btn-success" onclick="payOrder(${order.id})">
                                        <i class="bi bi-credit-card"></i> 模拟支付
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = html;
        }
        
        // 取消订单
        async function cancelOrder(orderId) {
            if (!confirm('确定要取消这个订单吗？')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}/cancel`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('订单已取消', 'success');
                    loadOrders();
                } else {
                    showToast(result.message || '取消失败');
                }
            } catch (error) {
                showToast('网络错误');
            }
        }
        
        // 模拟支付
        async function payOrder(orderId) {
            if (!confirm('模拟支付成功？')) {
                return;
            }
            
            // 这里只是前端模拟，实际应该调用后端API
            showToast('支付成功（模拟）', 'success');
        }
        
        // 重置筛选器
        function resetFilters() {
            document.getElementById('statusFilter').value = '';
            document.getElementById('dateFilter').value = '';
            loadOrders();
        }
        
        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuth()) return;
            
            // 显示用户名
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('userName').textContent = user.username || '用户';
            
            // 退出登录事件
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                logout();
            });
            
            // 加载订单
            loadOrders();
        });
    </script>
</body>
</html>
