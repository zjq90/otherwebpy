{% extends "base.html" %}

{% block title %}首页 - 农产品电商管理系统{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12 mb-4">
        <h2 class="mb-4">
            <i class="fa fa-tachometer mr-2"></i>系统概览
        </h2>
    </div>
</div>

<div class="row">
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card card-stat border-left-success shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-success text-uppercase mb-1">产品总数</div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="statProducts">-</div>
                    </div>
                    <div class="col-auto">
                        <i class="fa fa-cubes fa-2x text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card card-stat border-left-primary shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">客户总数</div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="statCustomers">-</div>
                    </div>
                    <div class="col-auto">
                        <i class="fa fa-users fa-2x text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card card-stat border-left-warning shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">订单总数</div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="statOrders">-</div>
                    </div>
                    <div class="col-auto">
                        <i class="fa fa-shopping-cart fa-2x text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card card-stat border-left-danger shadow h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-danger text-uppercase mb-1">待处理反馈</div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" id="statFeedbacks">-</div>
                    </div>
                    <div class="col-auto">
                        <i class="fa fa-comments fa-2x text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-lg-6 mb-4">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-success">
                    <i class="fa fa-shopping-bag mr-2"></i>最近订单
                </h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover" width="100%" cellspacing="0">
                        <thead class="thead-light">
                            <tr>
                                <th>订单号</th>
                                <th>客户名称</th>
                                <th>金额</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="recentOrders">
                            <tr><td colspan="4" class="text-center text-muted">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-6 mb-4">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                    <i class="fa fa-truck mr-2"></i>物流状态
                </h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover" width="100%" cellspacing="0">
                        <thead class="thead-light">
                            <tr>
                                <th>物流单号</th>
                                <th>物流公司</th>
                                <th>当前状态</th>
                            </tr>
                        </thead>
                        <tbody id="recentLogistics">
                            <tr><td colspan="3" class="text-center text-muted">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-lg-12 mb-4">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-warning">
                    <i class="fa fa-bell mr-2"></i>快捷操作
                </h6>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-xl-3 col-md-6 mb-3">
                        <a href="/products/add" class="btn btn-success btn-block btn-lg">
                            <i class="fa fa-plus-circle mr-2"></i>添加产品
                        </a>
                    </div>
                    <div class="col-xl-3 col-md-6 mb-3">
                        <a href="/customers/add" class="btn btn-primary btn-block btn-lg">
                            <i class="fa fa-user-plus mr-2"></i>添加客户
                        </a>
                    </div>
                    <div class="col-xl-3 col-md-6 mb-3">
                        <a href="/orders/add" class="btn btn-warning btn-block btn-lg">
                            <i class="fa fa-cart-plus mr-2"></i>新建订单
                        </a>
                    </div>
                    <div class="col-xl-3 col-md-6 mb-3">
                        <a href="/docs" class="btn btn-info btn-block btn-lg" target="_blank">
                            <i class="fa fa-book mr-2"></i>API文档
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    loadStatistics();
    loadRecentOrders();
    loadRecentLogistics();
});

async function loadStatistics() {
    try {
        const [products, customers, orders, feedbacks] = await Promise.all([
            apiGet('/api/products/', { limit: 1 }),
            apiGet('/api/customers/', { limit: 1 }),
            apiGet('/api/orders/', { limit: 1 }),
            apiGet('/api/feedbacks/', { limit: 1, status: 'pending' })
        ]);
        
        $('#statProducts').text(products.total);
        $('#statCustomers').text(customers.total);
        $('#statOrders').text(orders.total);
        $('#statFeedbacks').text(feedbacks.total || '-');
    } catch (error) {
        console.error('加载统计数据失败:', error);
    }
}

async function loadRecentOrders() {
    try {
        const data = await apiGet('/api/orders/', { limit: 5 });
        const orders = data.orders || [];
        const tbody = $('#recentOrders');
        
        if (orders.length === 0) {
            tbody.html('<tr><td colspan="4" class="text-center text-muted">暂无订单</td></tr>');
            return;
        }
        
        let html = '';
        orders.forEach(order => {
            html += `
                <tr onclick="location.href='/orders/detail/${order.id}'" style="cursor: pointer;">
                    <td>#${order.id}</td>
                    <td>${order.customer_name}</td>
                    <td>${formatMoney(order.total_amount)}</td>
                    <td>${getShippingStatusBadge(order.shipping_status)}</td>
                </tr>
            `;
        });
        tbody.html(html);
    } catch (error) {
        console.error('加载最近订单失败:', error);
        $('#recentOrders').html('<tr><td colspan="4" class="text-center text-danger">加载失败</td></tr>');
    }
}

async function loadRecentLogistics() {
    try {
        const data = await apiGet('/api/logistics/', { limit: 5 });
        const logistics = data.logistics || [];
        const tbody = $('#recentLogistics');
        
        if (logistics.length === 0) {
            tbody.html('<tr><td colspan="3" class="text-center text-muted">暂无物流信息</td></tr>');
            return;
        }
        
        let html = '';
        logistics.forEach(l => {
            html += `
                <tr>
                    <td>${l.tracking_number}</td>
                    <td>${l.logistics_company}</td>
                    <td><span class="badge badge-info">${l.current_status}</span></td>
                </tr>
            `;
        });
        tbody.html(html);
    } catch (error) {
        console.error('加载物流信息失败:', error);
        $('#recentLogistics').html('<tr><td colspan="3" class="text-center text-danger">加载失败</td></tr>');
    }
}
</script>
{% endblock %}
