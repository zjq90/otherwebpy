<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}农产品电商管理系统{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <a class="navbar-brand" href="/">
            <i class="fa fa-leaf mr-2"></i>农产品电商管理系统
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="fa fa-home mr-1"></i>首页
                    </a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="productDropdown" role="button" data-toggle="dropdown">
                        <i class="fa fa-cubes mr-1"></i>产品管理
                    </a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" href="/products">产品列表</a>
                        <a class="dropdown-item" href="/products/add">添加产品</a>
                    </div>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="customerDropdown" role="button" data-toggle="dropdown">
                        <i class="fa fa-users mr-1"></i>客户档案
                    </a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" href="/customers">客户列表</a>
                        <a class="dropdown-item" href="/customers/add">添加客户</a>
                    </div>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="orderDropdown" role="button" data-toggle="dropdown">
                        <i class="fa fa-shopping-cart mr-1"></i>订单管理
                    </a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" href="/orders">订单列表</a>
                        <a class="dropdown-item" href="/orders/add">新建订单</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/contracts">
                        <i class="fa fa-file-text mr-1"></i>合同管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logistics">
                        <i class="fa fa-truck mr-1"></i>物流追踪
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/feedbacks">
                        <i class="fa fa-comments mr-1"></i>反馈管理
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                {% block breadcrumb %}{% endblock %}
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <footer class="footer mt-5 py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">农产品电商管理系统 v1.0.0</span>
        </div>
    </footer>

    <div class="toast-container position-fixed" style="top: 80px; right: 20px; z-index: 9999;">
        <div id="toast" class="toast" role="alert" data-delay="3000">
            <div class="toast-header">
                <strong class="mr-auto" id="toastTitle">提示</strong>
                <button type="button" class="ml-2 mb-1 close" data-dismiss="toast">
                    <span>&times;</span>
                </button>
            </div>
            <div class="toast-body" id="toastBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
