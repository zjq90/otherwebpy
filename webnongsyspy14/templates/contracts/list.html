{% extends "base.html" %}

{% block title %}合同管理 - 农产品电商管理系统{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">首页</a></li>
        <li class="breadcrumb-item active" aria-current="page">合同管理</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold text-info">
                    <i class="fa fa-file-text mr-2"></i>合同列表
                </h6>
                <div>
                    <button class="btn btn-primary btn-sm" onclick="refreshData()">
                        <i class="fa fa-refresh mr-1"></i>刷新
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="search-bar">
                    <form id="searchForm" class="form-inline">
                        <div class="form-group mr-2">
                            <input type="text" class="form-control form-control-sm" id="searchKeyword" 
                                   placeholder="搜索合同编号、订单号...">
                        </div>
                        <div class="form-group mr-2">
                            <select class="form-control form-control-sm" id="searchStatus">
                                <option value="">全部状态</option>
                                <option value="draft">草稿</option>
                                <option value="pending">待签署</option>
                                <option value="signed">已签署</option>
                                <option value="expired">已过期</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="fa fa-search mr-1"></i>搜索
                        </button>
                    </form>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover" id="contractsTable">
                        <thead class="thead-light">
                            <tr>
                                <th>ID</th>
                                <th>合同编号</th>
                                <th>订单号</th>
                                <th>乙方</th>
                                <th>合同日期</th>
                                <th>状态</th>
                                <th>签署日期</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="contractsTableBody">
                            <tr>
                                <td colspan="8" class="text-center">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="row mt-4" id="paginationRow" style="display: none;">
                    <div class="col-md-6">
                        <span id="paginationInfo" class="text-muted"></span>
                    </div>
                    <div class="col-md-6">
                        <nav>
                            <ul class="pagination justify-content-end" id="paginationUl">
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="contractDetailModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="contractModalTitle">合同详情</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body" id="contractModalBody">
                <div class="text-center">加载中...</div>
            </div>
            <div class="modal-footer" id="contractModalFooter">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-success" id="signContractBtn" style="display: none;">
                    <i class="fa fa-check-circle mr-1"></i>签署合同
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
const pageSize = 10;
let currentContractId = null;

$(document).ready(function() {
    loadContracts();
    
    $('#searchForm').submit(function(e) {
        e.preventDefault();
        currentPage = 1;
        loadContracts();
    });
});

async function loadContracts() {
    try {
        const params = {
            page: currentPage,
            limit: pageSize
        };
        
        const keyword = $('#searchKeyword').val().trim();
        const status = $('#searchStatus').val();
        
        if (keyword) {
            params.keyword = keyword;
        }
        if (status) {
            params.status = status;
        }
        
        const data = await apiGet('/api/contracts/', params);
        
        const contracts = data.contracts || data || [];
        const total = data.total || contracts.length;
        
        renderTable(contracts);
        renderPagination(total);
        
    } catch (error) {
        showToast(error.message || '加载合同列表失败', '错误', 'error');
        renderTable([]);
    }
}

function renderTable(contracts) {
    const tbody = $('#contractsTableBody');
    
    if (!contracts || contracts.length === 0) {
        tbody.html('<tr><td colspan="8" class="text-center">暂无数据</td></tr>');
        return;
    }
    
    let html = '';
    contracts.forEach(contract => {
        const statusBadge = getStatusBadge(contract.status);
        html += `
            <tr>
                <td>${contract.id}</td>
                <td><code>${contract.contract_number}</code></td>
                <td>
                    <a href="/orders/detail/${contract.order_id}" class="text-primary">
                        #${contract.order_id}
                    </a>
                </td>
                <td>${contract.party_b || '-'}</td>
                <td>${formatDate(contract.contract_date)}</td>
                <td>${statusBadge}</td>
                <td>${contract.signed_date ? formatDate(contract.signed_date) : '-'}</td>
                <td>
                    <button class="btn btn-outline-info btn-sm mr-1" 
                            onclick="viewContract(${contract.id})" title="查看">
                        <i class="fa fa-eye"></i>
                    </button>
                    ${contract.status !== 'signed' ? `
                    <button class="btn btn-outline-success btn-sm mr-1" 
                            onclick="signContract(${contract.id})" title="签署">
                        <i class="fa fa-check"></i>
                    </button>
                    ` : ''}
                    <button class="btn btn-outline-danger btn-sm" 
                            onclick="deleteContract(${contract.id})" title="删除">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    });
    
    tbody.html(html);
}

function renderPagination(total) {
    const paginationRow = $('#paginationRow');
    const paginationInfo = $('#paginationInfo');
    const paginationUl = $('#paginationUl');
    
    if (total === 0) {
        paginationRow.hide();
        return;
    }
    
    paginationRow.show();
    
    const start = (currentPage - 1) * pageSize + 1;
    const end = Math.min(currentPage * pageSize, total);
    paginationInfo.text(`显示 ${start}-${end} 条，共 ${total} 条`);
    
    const totalPages = Math.ceil(total / pageSize);
    
    let html = '';
    
    if (currentPage > 1) {
        html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="goToPage(${currentPage - 1})">上一页</a></li>`;
    } else {
        html += `<li class="page-item disabled"><a class="page-link" href="javascript:void(0)">上一页</a></li>`;
    }
    
    for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
            html += `<li class="page-item active"><a class="page-link" href="javascript:void(0)">${i}</a></li>`;
        } else if (i >= currentPage - 2 && i <= currentPage + 2) {
            html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="goToPage(${i})">${i}</a></li>`;
        }
    }
    
    if (currentPage < totalPages) {
        html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="goToPage(${currentPage + 1})">下一页</a></li>`;
    } else {
        html += `<li class="page-item disabled"><a class="page-link" href="javascript:void(0)">下一页</a></li>`;
    }
    
    paginationUl.html(html);
}

function goToPage(page) {
    currentPage = page;
    loadContracts();
}

function refreshData() {
    currentPage = 1;
    $('#searchKeyword').val('');
    $('#searchStatus').val('');
    loadContracts();
}

function getStatusBadge(status) {
    const statusMap = {
        'draft': { class: 'badge-secondary', text: '草稿' },
        'pending': { class: 'badge-warning', text: '待签署' },
        'signed': { class: 'badge-success', text: '已签署' },
        'expired': { class: 'badge-danger', text: '已过期' }
    };
    const info = statusMap[status] || { class: 'badge-secondary', text: status };
    return `<span class="badge ${info.class}">${info.text}</span>`;
}

async function viewContract(id) {
    currentContractId = id;
    $('#contractModalTitle').text('合同详情');
    $('#contractModalBody').html('<div class="text-center"><i class="fa fa-spinner fa-spin mr-2"></i>加载中...</div>');
    $('#signContractBtn').hide();
    
    try {
        const contract = await apiGet(`/api/contracts/${id}`);
        
        const statusBadge = getStatusBadge(contract.status);
        const html = `
            <div class="contract-detail">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>合同编号：</strong><code>${contract.contract_number}</code></p>
                        <p><strong>关联订单：</strong>
                            <a href="/orders/detail/${contract.order_id}" class="text-primary" target="_blank">
                                #${contract.order_id}
                            </a>
                        </p>
                        <p><strong>甲方：</strong>${contract.party_a}</p>
                        <p><strong>乙方：</strong>${contract.party_b}</p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>合同状态：</strong>${statusBadge}</p>
                        <p><strong>合同日期：</strong>${formatDate(contract.contract_date)}</p>
                        <p><strong>签署日期：</strong>${contract.signed_date ? formatDate(contract.signed_date) : '-'}</p>
                    </div>
                </div>
                <hr>
                <div class="form-group">
                    <label><strong>合同内容：</strong></label>
                    <div class="border p-3 bg-light" style="max-height: 400px; overflow-y: auto;">
                        <pre style="white-space: pre-wrap; font-family: inherit; font-size: 14px;">${contract.contract_content || '无'}</pre>
                    </div>
                </div>
            </div>
        `;
        
        $('#contractModalBody').html(html);
        
        if (contract.status !== 'signed') {
            $('#signContractBtn').show();
        }
        
    } catch (error) {
        $('#contractModalBody').html(`<div class="alert alert-danger">${error.message || '加载合同详情失败'}</div>`);
    }
    
    $('#contractDetailModal').modal('show');
}

async function signContract(id) {
    if (!confirm('确定要签署此合同吗？')) {
        return;
    }
    
    try {
        await apiPut(`/api/contracts/${id}`, {
            status: 'signed',
            signed_date: new Date().toISOString().split('T')[0]
        });
        
        showToast('合同签署成功', '成功');
        $('#contractDetailModal').modal('hide');
        loadContracts();
        
    } catch (error) {
        showToast(error.message || '签署合同失败', '错误', 'error');
    }
}

async function deleteContract(id) {
    if (!confirm('确定要删除此合同吗？此操作不可恢复。')) {
        return;
    }
    
    try {
        await apiDelete(`/api/contracts/${id}`);
        showToast('合同删除成功', '成功');
        loadContracts();
    } catch (error) {
        showToast(error.message || '删除合同失败', '错误', 'error');
    }
}

$('#signContractBtn').click(function() {
    if (currentContractId) {
        signContract(currentContractId);
    }
});
</script>
{% endblock %}
