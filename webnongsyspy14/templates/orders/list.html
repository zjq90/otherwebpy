{% extends "base.html" %}

{% block title %}订单列表 - 农产品电商管理系统{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">首页</a></li>
        <li class="breadcrumb-item active" aria-current="page">订单管理</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12 mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2><i class="fa fa-shopping-cart mr-2"></i>订单管理</h2>
            <a href="/orders/add" class="btn btn-warning">
                <i class="fa fa-plus mr-1"></i>新建订单
            </a>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12 mb-4">
        <div class="card shadow">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                    <i class="fa fa-search mr-2"></i>搜索筛选
                </h6>
            </div>
            <div class="card-body">
                <form id="searchForm" class="form-inline">
                    <div class="form-group mr-3 mb-2">
                        <label class="mr-2">客户名称:</label>
                        <input type="text" class="form-control" id="searchCustomer" placeholder="请输入客户名称">
                    </div>
                    <div class="form-group mr-3 mb-2">
                        <label class="mr-2">发货状态:</label>
                        <select class="form-control" id="searchStatus">
                            <option value="">全部</option>
                            <option value="pending">待发货</option>
                            <option value="shipped">已发货</option>
                            <option value="delivered">已送达</option>
                        </select>
                    </div>
                    <div class="form-group mr-3 mb-2">
                        <label class="mr-2">开始日期:</label>
                        <input type="date" class="form-control" id="searchStartDate">
                    </div>
                    <div class="form-group mr-3 mb-2">
                        <label class="mr-2">结束日期:</label>
                        <input type="date" class="form-control" id="searchEndDate">
                    </div>
                    <button type="submit" class="btn btn-primary mb-2 mr-2">
                        <i class="fa fa-search mr-1"></i>搜索
                    </button>
                    <button type="button" class="btn btn-secondary mb-2" onclick="resetSearch()">
                        <i class="fa fa-refresh mr-1"></i>重置
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-warning">
                    <i class="fa fa-list mr-2"></i>订单列表
                    <span class="badge badge-warning ml-2" id="totalCount">0</span>
                </h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover" width="100%" cellspacing="0">
                        <thead class="thead-light">
                            <tr>
                                <th>订单号</th>
                                <th>客户名称</th>
                                <th>联系电话</th>
                                <th>订单日期</th>
                                <th>总金额</th>
                                <th>发货状态</th>
                                <th>预计送达</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="orderTable">
                            <tr>
                                <td colspan="8" class="text-center text-muted">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <nav id="paginationNav" class="mt-3">
                    <ul class="pagination justify-content-center" id="pagination">
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p>确定要删除该订单吗？此操作不可恢复。</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">确认删除</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
const pageSize = 10;
let deleteOrderId = null;

$(document).ready(function() {
    loadOrders();
    
    $('#searchForm').submit(function(e) {
        e.preventDefault();
        currentPage = 1;
        loadOrders();
    });
});

async function loadOrders() {
    try {
        const customerName = $('#searchCustomer').val();
        const status = $('#searchStatus').val();
        const startDate = $('#searchStartDate').val();
        const endDate = $('#searchEndDate').val();
        
        const params = {
            page: currentPage,
            limit: pageSize
        };
        
        if (customerName) params.customer_name = customerName;
        if (status) params.shipping_status = status;
        if (startDate) params.start_date = startDate;
        if (endDate) params.end_date = endDate;
        
        const data = await apiGet('/api/orders/', params);
        renderOrderTable(data.orders || []);
        renderPagination(data.total);
        $('#totalCount').text(data.total);
    } catch (error) {
        console.error('加载订单列表失败:', error);
        $('#orderTable').html('<tr><td colspan="8" class="text-center text-danger">加载失败</td></tr>');
    }
}

function renderOrderTable(orders) {
    const tbody = $('#orderTable');
    
    if (orders.length === 0) {
        tbody.html('<tr><td colspan="8" class="text-center text-muted">暂无数据</td></tr>');
        return;
    }
    
    let html = '';
    orders.forEach(order => {
        html += `
            <tr>
                <td>#${order.id}</td>
                <td>${order.customer_name}</td>
                <td>${order.customer_phone}</td>
                <td>${formatDate(order.order_date)}</td>
                <td>${formatMoney(order.total_amount)}</td>
                <td>${getShippingStatusBadge(order.shipping_status)}</td>
                <td>${formatDate(order.estimated_delivery_date)}</td>
                <td class="table-action-btns">
                    <button class="btn btn-sm btn-info" onclick="viewOrder(${order.id})">
                        <i class="fa fa-eye"></i>
                    </button>
                    <button class="btn btn-sm btn-warning" onclick="editOrder(${order.id})">
                        <i class="fa fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="showDeleteModal(${order.id})">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    });
    tbody.html(html);
}

function renderPagination(total) {
    const totalPages = Math.ceil(total / pageSize);
    const pagination = $('#pagination');
    
    if (totalPages <= 1) {
        pagination.html('');
        return;
    }
    
    let html = '';
    
    html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="goToPage(${currentPage - 1})">上一页</a>
    </li>`;
    
    for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="goToPage(${i})">${i}</a>
            </li>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
            html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
        }
    }
    
    html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="goToPage(${currentPage + 1})">下一页</a>
    </li>`;
    
    pagination.html(html);
}

function goToPage(page) {
    currentPage = page;
    loadOrders();
    return false;
}

function resetSearch() {
    $('#searchCustomer').val('');
    $('#searchStatus').val('');
    $('#searchStartDate').val('');
    $('#searchEndDate').val('');
    currentPage = 1;
    loadOrders();
}

function viewOrder(id) {
    location.href = `/orders/detail/${id}`;
}

function editOrder(id) {
    location.href = `/orders/edit/${id}`;
}

function showDeleteModal(id) {
    deleteOrderId = id;
    $('#deleteModal').modal('show');
}

$('#confirmDeleteBtn').click(async function() {
    if (deleteOrderId === null) return;
    
    try {
        await apiDelete(`/api/orders/${deleteOrderId}`);
        $('#deleteModal').modal('hide');
        showToast('删除成功', '成功');
        loadOrders();
    } catch (error) {
        showToast(error.message || '删除失败', '错误', 'error');
    }
});
</script>
{% endblock %}
