{% extends "base.html" %}

{% block title %}物流轨迹 - 农产品电商管理系统{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">首页</a></li>
        <li class="breadcrumb-item"><a href="/logistics">物流管理</a></li>
        <li class="breadcrumb-item active" aria-current="page">物流轨迹</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card shadow mb-4" id="logisticsInfoCard">
            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold text-warning">
                    <i class="fa fa-truck mr-2"></i>物流信息
                </h6>
                <div>
                    <a href="/logistics" class="btn btn-secondary btn-sm">
                        <i class="fa fa-arrow-left mr-1"></i>返回列表
                    </a>
                </div>
            </div>
            <div class="card-body">
                <div class="text-center">
                    <i class="fa fa-spinner fa-spin mr-2"></i>加载中...
                </div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">
                    <i class="fa fa-map-marker mr-2"></i>物流轨迹
                </h6>
            </div>
            <div class="card-body" id="tracksContainer">
                <div class="text-center">
                    <i class="fa fa-spinner fa-spin mr-2"></i>加载中...
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addTrackModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加物流轨迹</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="addTrackForm">
                    <div class="form-group">
                        <label for="trackStatus">状态 <span class="text-danger">*</span></label>
                        <select class="form-control" id="trackStatus" required>
                            <option value="">请选择状态</option>
                            <option value="已揽收">已揽收</option>
                            <option value="运输中">运输中</option>
                            <option value="派送中">派送中</option>
                            <option value="已签收">已签收</option>
                            <option value="已退回">已退回</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="trackLocation">当前位置 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="trackLocation" required
                               placeholder="例如：北京市朝阳区分拣中心">
                    </div>
                    <div class="form-group">
                        <label for="trackDescription">描述</label>
                        <textarea class="form-control" id="trackDescription" rows="3"
                                  placeholder="详细描述..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="trackTime">轨迹时间</label>
                        <input type="datetime-local" class="form-control" id="trackTime">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitTrack()">
                    <i class="fa fa-save mr-1"></i>保存
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const logisticsId = {{ logistics_id }};
let logisticsInfo = null;

$(document).ready(function() {
    loadLogisticsInfo();
    loadTracks();
});

async function loadLogisticsInfo() {
    try {
        logisticsInfo = await apiGet(`/api/logistics/${logisticsId}`);
        renderLogisticsInfo();
    } catch (error) {
        $('#logisticsInfoCard .card-body').html(
            `<div class="alert alert-danger">${error.message || '加载物流信息失败'}</div>`
        );
    }
}

async function loadTracks() {
    try {
        const tracks = await apiGet(`/api/logistics/${logisticsId}/tracks`);
        renderTracks(tracks);
    } catch (error) {
        $('#tracksContainer').html(
            `<div class="alert alert-danger">${error.message || '加载物流轨迹失败'}</div>`
        );
    }
}

function renderLogisticsInfo() {
    if (!logisticsInfo) return;
    
    const statusBadge = getStatusBadge(logisticsInfo.current_status);
    const html = `
        <div class="row">
            <div class="col-md-6">
                <p><strong>物流单号：</strong><code class="text-lg">${logisticsInfo.tracking_number}</code></p>
                <p><strong>关联订单：</strong>
                    <a href="/orders/detail/${logisticsInfo.order_id}" class="text-primary">
                        #${logisticsInfo.order_id}
                    </a>
                </p>
                <p><strong>物流公司：</strong>${logisticsInfo.logistics_company || '-'}</p>
            </div>
            <div class="col-md-6">
                <p><strong>当前状态：</strong>${statusBadge}</p>
                <p><strong>当前位置：</strong>${logisticsInfo.current_location || '-'}</p>
                <p><strong>预计到达：</strong>${logisticsInfo.estimated_arrival ? formatDate(logisticsInfo.estimated_arrival) : '-'}</p>
            </div>
        </div>
        <hr>
        <div class="text-right">
            <button type="button" class="btn btn-outline-success btn-sm" onclick="openAddTrackModal()">
                <i class="fa fa-plus mr-1"></i>添加轨迹
            </button>
        </div>
    `;
    
    $('#logisticsInfoCard .card-body').html(html);
}

function renderTracks(tracks) {
    const container = $('#tracksContainer');
    
    if (!tracks || tracks.length === 0) {
        container.html(`
            <div class="text-center py-5">
                <i class="fa fa-truck text-muted" style="font-size: 48px;"></i>
                <p class="mt-3 text-muted">暂无物流轨迹</p>
                <button type="button" class="btn btn-outline-success btn-sm" onclick="openAddTrackModal()">
                    <i class="fa fa-plus mr-1"></i>添加第一条轨迹
                </button>
            </div>
        `);
        return;
    }
    
    const sortedTracks = tracks.sort((a, b) => {
        const timeA = new Date(a.track_time || 0);
        const timeB = new Date(b.track_time || 0);
        return timeB - timeA;
    });
    
    let html = `
        <div class="timeline">
    `;
    
    sortedTracks.forEach((track, index) => {
        const statusBadge = getStatusBadge(track.status);
        const isLatest = index === 0;
        
        html += `
            <div class="timeline-item ${isLatest ? 'timeline-item-latest' : ''}">
                <div class="timeline-dot ${isLatest ? 'timeline-dot-active' : ''}"></div>
                <div class="timeline-content">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1">
                                ${statusBadge}
                                <span class="ml-2">${track.location || '-'}</span>
                            </h6>
                            <p class="text-muted mb-2 small">${formatDateTime(track.track_time)}</p>
                            ${track.description ? `<p class="mb-0">${track.description}</p>` : ''}
                        </div>
                        ${isLatest ? '<span class="badge badge-success">最新</span>' : ''}
                    </div>
                </div>
            </div>
        `;
    });
    
    html += `</div>`;
    container.html(html);
}

function getStatusBadge(status) {
    const statusMap = {
        '已揽收': { class: 'badge-secondary', text: '已揽收' },
        '运输中': { class: 'badge-primary', text: '运输中' },
        '派送中': { class: 'badge-warning', text: '派送中' },
        '已签收': { class: 'badge-success', text: '已签收' },
        '已退回': { class: 'badge-danger', text: '已退回' }
    };
    const info = statusMap[status] || { class: 'badge-secondary', text: status };
    return `<span class="badge ${info.class}">${info.text}</span>`;
}

function openAddTrackModal() {
    $('#addTrackForm')[0].reset();
    
    const now = new Date();
    const formatted = now.toISOString().slice(0, 16);
    $('#trackTime').val(formatted);
    
    $('#addTrackModal').modal('show');
}

async function submitTrack() {
    const status = $('#trackStatus').val();
    const location = $('#trackLocation').val().trim();
    
    if (!status || !location) {
        showToast('请填写必填字段', '错误', 'error');
        return;
    }
    
    const formData = {
        status: status,
        location: location,
        description: $('#trackDescription').val().trim()
    };
    
    const trackTime = $('#trackTime').val();
    if (trackTime) {
        formData.track_time = trackTime;
    }
    
    try {
        await apiPost(`/api/logistics/${logisticsId}/tracks`, formData);
        showToast('轨迹添加成功', '成功');
        $('#addTrackModal').modal('hide');
        
        await loadTracks();
        await loadLogisticsInfo();
        
    } catch (error) {
        showToast(error.message || '添加失败', '错误', 'error');
    }
}
</script>
{% endblock %}
